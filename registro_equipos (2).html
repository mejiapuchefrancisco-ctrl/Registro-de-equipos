<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#12233B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2312233B'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial,sans-serif' font-weight='900' fill='%23F2660A' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2312233B'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial,sans-serif' font-weight='900' fill='%23F2660A' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Equipos JMC">
<title>AIRPLAN T1 JMC — Control de Equipos</title>
<style>
  :root{
    --ink:#12233B;
    --ink-soft:#3C4F68;
    --paper:#EDEFF2;
    --card:#FFFFFF;
    --line:#D7DBE1;
    --orange:#F2660A;
    --orange-deep:#C94F02;
    --orange-soft:#FDE4D2;
    --green:#1E7D46;
    --green-soft:#DCF0E4;
    --red:#C81E3A;
    --red-soft:#FBE0E4;
    --blue:#1B5FA8;
    --blue-soft:#DCE9F8;
    --radius:14px;
    --shadow: 0 2px 10px rgba(18,35,59,0.08);
    --shadow-lg: 0 8px 28px rgba(18,35,59,0.16);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    overscroll-behavior-y:none;
  }
  .hazard{
    height:6px;
    background-image: repeating-linear-gradient(-45deg, var(--orange), var(--orange) 12px, var(--ink) 12px, var(--ink) 24px);
    flex-shrink:0;
  }
  #app{ display:flex; flex-direction:column; height:100vh; }
  header.topbar{
    background:var(--ink);
    color:#fff;
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-shrink:0;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--orange); font-weight:700;
  }
  .brand h1{ font-size:19px; margin:0; font-weight:800; letter-spacing:.01em; }
  .mode-toggle{ display:flex; background:rgba(255,255,255,0.1); border-radius:999px; padding:4px; gap:2px; }
  .mode-toggle button{
    border:none; background:transparent; color:#cfd8e3; font-weight:700; font-size:13px;
    padding:9px 16px; border-radius:999px; cursor:pointer; letter-spacing:.02em;
  }
  .mode-toggle button.active{ background:var(--orange); color:#fff; }

  main{ flex:1; overflow-y:auto; padding:18px; padding-bottom:110px; }
  .view{ display:none; max-width:640px; margin:0 auto; }
  .view.active{ display:block; }

  /* ---- Stepper ---- */
  .stepper{ display:flex; gap:6px; margin-bottom:18px; }
  .stepper .dot{ flex:1; height:5px; border-radius:3px; background:var(--line); }
  .stepper .dot.done{ background:var(--green); }
  .stepper .dot.now{ background:var(--orange); }

  .card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:16px; margin-bottom:14px; border:1px solid var(--line);
  }
  .card h2{
    font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft);
    margin:0 0 12px 0; font-weight:800; display:flex; align-items:center; gap:8px;
  }
  .card h2 .num{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:6px; background:var(--ink); color:#fff; font-size:12px;
  }
  .picked-summary{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--green-soft); border:1px solid #b7ddc4; border-radius:10px;
    padding:12px 14px; font-weight:700; color:#0d5030; font-size:14.5px;
  }
  .picked-summary button{
    border:none; background:#fff; color:var(--ink); font-weight:700; font-size:12.5px;
    padding:7px 12px; border-radius:8px; cursor:pointer; border:1px solid var(--line);
  }

  .search-box{
    width:100%; padding:13px 14px; border-radius:10px; border:1.5px solid var(--line);
    font-size:15px; margin-bottom:10px; background:#fff;
  }
  .search-box:focus{ outline:none; border-color:var(--orange); }

  .option-list{ display:flex; flex-direction:column; gap:8px; max-height:340px; overflow-y:auto; }
  .option-row{
    display:flex; align-items:center; gap:12px;
    padding:14px 14px; border-radius:10px; border:1.5px solid var(--line); background:#fff;
    cursor:pointer; font-size:15px; font-weight:600; text-align:left;
  }
  .option-row:active{ background:var(--orange-soft); border-color:var(--orange); }
  .option-row .code{
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:12.5px; font-weight:700; color:#fff; background:var(--ink-soft);
    padding:3px 7px; border-radius:6px; flex-shrink:0;
  }
  .option-row .sub{ display:block; font-size:12px; font-weight:500; color:var(--ink-soft); margin-top:2px;}
  .empty-hint{ color:var(--ink-soft); font-size:14px; padding:16px 4px; text-align:center; }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  label.field-label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:0 0 6px 2px; text-transform:uppercase; letter-spacing:.04em;}
  input[type=number], input[type=date], input[type=time], select, textarea{
    width:100%; padding:13px 14px; border-radius:10px; border:1.5px solid var(--line);
    font-size:16px; background:#fff; font-family:inherit; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--orange); }
  textarea{ resize:vertical; min-height:64px; }
  .field{ margin-bottom:14px; }
  .hstepper{ display:flex; align-items:center; gap:10px; }
  .hstepper button{
    width:48px; height:48px; border-radius:10px; border:1.5px solid var(--line); background:#fff;
    font-size:22px; font-weight:800; color:var(--ink); cursor:pointer; flex-shrink:0;
  }
  .hstepper input{ text-align:center; font-weight:800; font-size:18px; }

  footer.bar{
    position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line);
    padding:12px 18px; padding-bottom:calc(12px + env(safe-area-inset-bottom));
    box-shadow: 0 -6px 20px rgba(18,35,59,0.08);
  }
  .bar-inner{ max-width:640px; margin:0 auto; display:flex; gap:10px; }
  .btn{
    flex:1; border:none; border-radius:12px; padding:16px; font-size:16px; font-weight:800;
    cursor:pointer; letter-spacing:.01em;
  }
  .btn-primary{ background:var(--orange); color:#fff; }
  .btn-primary:disabled{ background:#e7ab84; cursor:not-allowed; }
  .btn-ghost{ background:var(--paper); color:var(--ink); border:1.5px solid var(--line); flex:0 0 auto; padding:16px 18px; }

  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%) translateY(-140%);
    background:var(--ink); color:#fff; padding:14px 22px; border-radius:12px; font-weight:700;
    box-shadow:var(--shadow-lg); z-index:50; transition:transform .3s ease; display:flex; align-items:center; gap:10px;
    max-width:90vw;
  }
  .toast.show{ transform:translateX(-50%) translateY(0); }
  .toast .chk{ width:22px; height:22px; border-radius:50%; background:var(--green); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px;}

  /* ---- Person picker ---- */
  .person-card{ display:flex; flex-direction:column; gap:2px; }
  .person-card .name{ font-size:15px; }
  .person-card .meta{ font-size:12px; color:var(--ink-soft); font-weight:600; }
  .cargo-chip{
    display:inline-block; font-size:11px; font-weight:800; padding:2px 8px; border-radius:999px; margin-right:6px;
  }
  .cargo-Oficial{ background:var(--blue-soft); color:var(--blue); }
  .cargo-Ayudante{ background:var(--green-soft); color:var(--green); }
  .cargo-Maestro{ background:var(--orange-soft); color:var(--orange-deep); }
  .cargo-Otro{ background:#eee; color:#555; }

  /* ---- Admin ---- */
  .kpi-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:16px; }
  .kpi{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); }
  .kpi .label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:700; margin-bottom:6px;}
  .kpi .value{ font-size:26px; font-weight:800; color:var(--ink); }
  .kpi.accent .value{ color:var(--orange); }

  .filter-row{ display:flex; gap:8px; margin-bottom:14px; align-items:flex-end; flex-wrap:wrap; }
  .filter-row .field{ margin-bottom:0; flex:1; min-width:130px; }

  .barchart{ display:flex; flex-direction:column; gap:8px; }
  .barchart .row{ display:grid; grid-template-columns:78px 1fr 56px; align-items:center; gap:8px; font-size:12.5px; }
  .barchart .track{ background:var(--paper); border-radius:6px; height:20px; overflow:hidden; }
  .barchart .fill{ background:var(--orange); height:100%; border-radius:6px; }
  .barchart .lbl{ font-weight:700; color:var(--ink-soft); }
  .barchart .val{ font-weight:800; text-align:right; }

  table.reg-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.reg-table th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft);
    padding:8px 8px; border-bottom:2px solid var(--line); position:sticky; top:0; background:var(--card);
  }
  table.reg-table td{ padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.reg-table tr:last-child td{ border-bottom:none; }
  .table-wrap{ max-height:420px; overflow:auto; border:1px solid var(--line); border-radius:12px; background:var(--card); box-shadow:var(--shadow); }
  .tag{ display:inline-block; font-size:11px; font-weight:800; padding:2px 8px; border-radius:6px; background:var(--ink); color:#fff; }

  .refresh-fab{
    position:fixed; right:18px; bottom:100px; width:52px; height:52px; border-radius:50%;
    background:var(--ink); color:#fff; border:none; box-shadow:var(--shadow-lg); font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .loading{ text-align:center; padding:40px 10px; color:var(--ink-soft); font-weight:600; }
  .spin{ display:inline-block; width:22px;height:22px;border:3px solid var(--line); border-top-color:var(--orange); border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:10px;}
  @keyframes spin{ to{ transform:rotate(360deg); } }
  ::-webkit-scrollbar{ width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{ background:#c3c9d1; border-radius:4px;}
</style>
</head>
<body>
<div id="app">
  <div class="hazard"></div>
  <header class="topbar">
    <div class="brand">
      <span class="eyebrow">Airplan T1 · JMC</span>
      <h1>Control de Equipos</h1>
    </div>
    <div class="mode-toggle">
      <button id="btnModeReg" class="active">Registrar Equipo</button>
      <button id="btnModeAdmin">Panel Admin</button>
    </div>
  </header>

  <main id="main">
    <!-- ============ VISTA REGISTRO ============ -->
    <section id="viewRegistro" class="view active">
      <div class="stepper" id="stepper"></div>
      <div id="regSteps"></div>
    </section>

    <!-- ============ VISTA ADMIN ============ -->
    <section id="viewAdmin" class="view">
      <div class="card">
        <h2>Filtrar por fecha</h2>
        <div class="filter-row">
          <div class="field">
            <label class="field-label">Desde</label>
            <input type="date" id="admFrom">
          </div>
          <div class="field">
            <label class="field-label">Hasta</label>
            <input type="date" id="admTo">
          </div>
          <div class="field">
            <label class="field-label">Fecha de corte (liquidación)</label>
            <input type="date" id="admCorte">
          </div>
        </div>
      </div>

      <div class="kpi-grid" id="admKpis"></div>

      <div class="card">
        <h2>Horas por frente</h2>
        <div class="barchart" id="admChart"></div>
      </div>

      <div class="card">
        <h2>Equipos registrados <span id="admCount" style="text-transform:none;letter-spacing:0;font-weight:600;"></span></h2>
        <div class="table-wrap">
          <table class="reg-table" id="admTable">
            <thead><tr><th>Fecha</th><th>Nombre</th><th>Frente</th><th>Actividad</th><th>Hrs</th><th>Tipo</th></tr></thead>
            <tbody id="admTbody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="bar" id="footerBar">
    <div class="bar-inner" id="footerInner"></div>
  </footer>

  <div class="toast" id="toast"><span class="chk">✓</span><span id="toastMsg"></span></div>
</div>

<script>
// ============================================================
// Preparar estructuras de datos
// ============================================================
const FRENTES = DATA.frentes.map(([codigo, nombre]) => ({ codigo, nombre }));
const CAPITULOS = DATA.capitulos.map(([codigo, codfrente, nombre]) => ({ codigo, codfrente, nombre }));
const SUBCAPS = DATA.subcaps.map(([codigo, codcap, nombre]) => ({ codigo, codcap, nombre }));
const ACTIVIDADES = DATA.actividades.map(([codigo, codsubcap, desc, unidad]) => ({ codigo, codsubcap, desc, unidad }));
const EQUIPOS = DATA.equipos.map(([proveedor, descripcion, unidad, valor]) => ({ proveedor, descripcion, unidad, valor }));
const SOLICITANTES = DATA.solicitantes;
const PROVEEDORES = [...new Set(EQUIPOS.map(e => e.proveedor))].sort();

function capitulosDeFrente(codfrente) { return CAPITULOS.filter(c => c.codfrente === codfrente); }
function subcapsDeCapitulo(codcap) { return SUBCAPS.filter(s => s.codcap === codcap); }
function actividadesDeSubcap(codsubcap) { return ACTIVIDADES.filter(a => a.codsubcap === codsubcap); }
function equiposDeProveedor(proveedor) { return EQUIPOS.filter(e => e.proveedor === proveedor); }

const frenteByCodigo = Object.fromEntries(FRENTES.map(f => [f.codigo, f]));

function todayISO() {
  const d = new Date();
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}
function fmtFecha(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ============================================================
// Backend: Google Apps Script (Google Sheets) — sin cuenta requerida
// ============================================================
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyUwEY_pT8K0mR8MlQtcwUEP9EvKbP6xrxJh_V37hOP2ngi3WQFJS7K5VbnKKTq1RPT/exec";

async function backendGuardar(entry) {
  if (WEBAPP_URL.indexOf('REEMPLAZAR') === 0) {
    throw new Error('CONFIG: falta configurar la URL del backend (WEBAPP_URL) en el código.');
  }
  const res = await fetch(WEBAPP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(entry),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json().catch(() => ({}));
  if (data && data.ok === false) throw new Error(data.error || 'error desconocido');
  return true;
}
async function backendListar() {
  const res = await fetch(WEBAPP_URL, { method: 'GET' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}

// ============================================================
// Estado del formulario
// ============================================================
let form = {};
let step = 1; // 1 solicitante,2 frente,3 capitulo,4 subcap,5 actividad,6 proveedor,7 equipo,8 detalle

function resetForm(keepSolicitante) {
  const keep = keepSolicitante ? { fechaSolicitud: form.fechaSolicitud, solicitante: form.solicitante } : {};
  form = {
    fechaSolicitud: todayISO(), solicitante: null,
    codfrente: null, codcap: null, codsubcap: null, codact: null, actDesc: null,
    proveedor: null, equipo: null, equipoUnidad: null, equipoValorRef: null,
    cantidad: 1, valorUnitario: '', fechaIngreso: '', fechaSalida: '',
    remisionSalida: '', remisionLlegada: '', observaciones: '',
    ...keep,
  };
  step = keepSolicitante ? 2 : 1;
}
resetForm(false);

function showToast(msg, longer) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(() => t.classList.remove('show'), longer ? 5500 : 2600);
}

function renderStepper() {
  const el = document.getElementById('stepper');
  el.innerHTML = '';
  for (let i = 1; i <= 8; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i < step ? ' done' : i === step ? ' now' : '');
    el.appendChild(dot);
  }
}

function card(titleNum, titleText, contentEl) {
  const c = document.createElement('div');
  c.className = 'card';
  const h = document.createElement('h2');
  h.innerHTML = `<span class="num">${titleNum}</span> ${titleText}`;
  c.appendChild(h);
  c.appendChild(contentEl);
  return c;
}

function searchableList(items, renderRow, onPick, placeholder) {
  const wrap = document.createElement('div');
  const search = document.createElement('input');
  search.type = 'text'; search.className = 'search-box'; search.placeholder = placeholder || 'Buscar...';
  wrap.appendChild(search);
  const list = document.createElement('div'); list.className = 'option-list';
  wrap.appendChild(list);
  function paint(filter) {
    list.innerHTML = '';
    const f = (filter || '').toLowerCase();
    const filtered = f ? items.filter(it => it._search.includes(f)) : items;
    if (!filtered.length) {
      const e = document.createElement('div'); e.className = 'empty-hint';
      e.textContent = 'Sin resultados. Intente con otras palabras.';
      list.appendChild(e); return;
    }
    filtered.slice(0, 200).forEach(it => {
      const row = document.createElement('button');
      row.className = 'option-row'; row.type = 'button';
      row.innerHTML = renderRow(it);
      row.onclick = () => onPick(it);
      list.appendChild(row);
    });
  }
  search.addEventListener('input', () => paint(search.value));
  paint('');
  return wrap;
}

function pickedSummary(html, onEdit) {
  const d = document.createElement('div'); d.className = 'card';
  d.innerHTML = `<div class="picked-summary" style="align-items:flex-start;">${html}<button type="button" class="btn-edit">Cambiar</button></div>`;
  setTimeout(() => { d.querySelector('.btn-edit').onclick = onEdit; });
  return d;
}

// ============================================================
// Render principal
// ============================================================
function renderRegistro() {
  renderStepper();
  const el = document.getElementById('regSteps');
  el.innerHTML = '';
  const footer = document.getElementById('footerInner');
  footer.innerHTML = '';

  if (step >= 2) el.appendChild(pickedSummary(
    `<div><b>${fmtFecha(form.fechaSolicitud)}</b> · ${form.solicitante}</div>`, () => { step = 1; renderRegistro(); }));
  if (step >= 3) el.appendChild(pickedSummary(
    `<div><span class="code" style="background:var(--blue)">${form.codfrente}</span> ${frenteByCodigo[form.codfrente].nombre}</div>`,
    () => { step = 2; renderRegistro(); }));
  if (step >= 4) {
    const c = CAPITULOS.find(x => x.codigo === form.codcap);
    el.appendChild(pickedSummary(`<div><span class="code">${c.codigo}</span> ${c.nombre}</div>`, () => { step = 3; renderRegistro(); }));
  }
  if (step >= 5) {
    const s = SUBCAPS.find(x => x.codigo === form.codsubcap);
    el.appendChild(pickedSummary(`<div><span class="code">${s.codigo}</span> ${s.nombre}</div>`, () => { step = 4; renderRegistro(); }));
  }
  if (step >= 6) el.appendChild(pickedSummary(
    `<div><span class="code">${form.codact}</span><br><span style="font-weight:600;font-size:13px;">${form.actDesc}</span></div>`,
    () => { step = 5; renderRegistro(); }));
  if (step >= 7) el.appendChild(pickedSummary(`<div><b>${form.proveedor}</b></div>`, () => { step = 6; renderRegistro(); }));
  if (step >= 8) el.appendChild(pickedSummary(`<div>${form.equipo} <span class="sub">(${form.equipoUnidad})</span></div>`, () => { step = 7; renderRegistro(); }));

  if (step === 1) el.appendChild(stepSolicitante());
  else if (step === 2) el.appendChild(stepFrente());
  else if (step === 3) el.appendChild(stepCapitulo());
  else if (step === 4) el.appendChild(stepSubcap());
  else if (step === 5) el.appendChild(stepActividad());
  else if (step === 6) el.appendChild(stepProveedor());
  else if (step === 7) el.appendChild(stepEquipo());
  else if (step === 8) el.appendChild(stepDetalle());

  renderFooter();
}

// ---- Paso 1 ----
function stepSolicitante() {
  const items = SOLICITANTES.map(s => ({ nombre: s, _search: s.toLowerCase() }));
  const list = searchableList(items, p => `<div class="person-card"><span class="name">${p.nombre}</span></div>`,
    p => { form.solicitante = p.nombre; step = 2; renderRegistro(); }, 'Buscar residente o maestro…');
  const fechaField = document.createElement('div'); fechaField.className = 'field';
  fechaField.innerHTML = `<label class="field-label">Fecha de solicitud</label>`;
  const fechaInput = document.createElement('input'); fechaInput.type = 'date'; fechaInput.value = form.fechaSolicitud;
  fechaInput.onchange = () => { form.fechaSolicitud = fechaInput.value; };
  fechaField.appendChild(fechaInput);
  const wrap = document.createElement('div'); wrap.appendChild(fechaField); wrap.appendChild(list);
  return card(1, '¿Quién solicita el equipo?', wrap);
}

// ---- Paso 2: Frente ----
function stepFrente() {
  const wrap = document.createElement('div');
  const list = document.createElement('div'); list.className = 'option-list';
  FRENTES.forEach(f => {
    const row = document.createElement('button'); row.type = 'button'; row.className = 'option-row';
    row.innerHTML = `<span class="code">${f.codigo}</span> ${f.nombre}`;
    row.onclick = () => { form.codfrente = f.codigo; form.codcap = null; form.codsubcap = null; form.codact = null; step = 3; renderRegistro(); };
    list.appendChild(row);
  });
  wrap.appendChild(list);
  return card(2, 'Frente donde se usará el equipo', wrap);
}
// ---- Paso 3: Capitulo ----
function stepCapitulo() {
  const wrap = document.createElement('div');
  const list = document.createElement('div'); list.className = 'option-list';
  capitulosDeFrente(form.codfrente).forEach(c => {
    const row = document.createElement('button'); row.type = 'button'; row.className = 'option-row';
    row.innerHTML = `<span class="code">${c.codigo}</span> ${c.nombre}`;
    row.onclick = () => { form.codcap = c.codigo; form.codsubcap = null; form.codact = null; step = 4; renderRegistro(); };
    list.appendChild(row);
  });
  wrap.appendChild(list);
  return card(3, 'Capítulo', wrap);
}
// ---- Paso 4: Subcapitulo ----
function stepSubcap() {
  const wrap = document.createElement('div');
  const list = document.createElement('div'); list.className = 'option-list';
  subcapsDeCapitulo(form.codcap).forEach(s => {
    const row = document.createElement('button'); row.type = 'button'; row.className = 'option-row';
    row.innerHTML = `<span class="code">${s.codigo}</span> ${s.nombre}`;
    row.onclick = () => { form.codsubcap = s.codigo; form.codact = null; step = 5; renderRegistro(); };
    list.appendChild(row);
  });
  wrap.appendChild(list);
  return card(4, 'Subcapítulo', wrap);
}
// ---- Paso 5: Actividad ----
function stepActividad() {
  const opciones = actividadesDeSubcap(form.codsubcap).map(a => ({ ...a, _search: (a.codigo + ' ' + a.desc).toLowerCase() }));
  const wrap = document.createElement('div');
  const list = searchableList(opciones, a => `<div><span class="code">${a.codigo}</span><span class="sub">${a.desc} · ${a.unidad}</span></div>`,
    a => { form.codact = a.codigo; form.actDesc = a.desc; step = 6; renderRegistro(); }, 'Buscar actividad…');
  wrap.appendChild(list);
  return card(5, 'Actividad relacionada', wrap);
}
// ---- Paso 6: Proveedor ----
function stepProveedor() {
  const wrap = document.createElement('div');
  const list = document.createElement('div'); list.className = 'option-list';
  PROVEEDORES.forEach(p => {
    const row = document.createElement('button'); row.type = 'button'; row.className = 'option-row';
    row.textContent = p;
    row.onclick = () => { form.proveedor = p; form.equipo = null; step = 7; renderRegistro(); };
    list.appendChild(row);
  });
  wrap.appendChild(list);
  return card(6, 'Proveedor', wrap);
}
// ---- Paso 7: Equipo ----
function stepEquipo() {
  const opciones = equiposDeProveedor(form.proveedor).map(e => ({ ...e, _search: e.descripcion.toLowerCase() }));
  const wrap = document.createElement('div');
  const list = searchableList(opciones, e => `<div>${e.descripcion}<span class="sub">${e.unidad} · valor ref. $${Number(e.valor).toLocaleString('es-CO')}</span></div>`,
    e => {
      form.equipo = e.descripcion; form.equipoUnidad = e.unidad; form.equipoValorRef = e.valor;
      form.valorUnitario = e.valor;
      step = 8; renderRegistro();
    }, 'Buscar equipo…');
  wrap.appendChild(list);

  const libre = document.createElement('div'); libre.className = 'field'; libre.style.marginTop = '14px';
  libre.innerHTML = `<label class="field-label">¿No está en la lista? Escríbalo aquí</label>`;
  const inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = 'Nombre del equipo';
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn btn-primary'; btn.style.marginTop = '8px';
  btn.textContent = 'Usar este equipo';
  btn.onclick = () => {
    if (!inp.value.trim()) return;
    form.equipo = inp.value.trim(); form.equipoUnidad = 'UN'; form.equipoValorRef = null; form.valorUnitario = '';
    step = 8; renderRegistro();
  };
  libre.appendChild(inp); libre.appendChild(document.createElement('br')); libre.appendChild(btn);
  wrap.appendChild(libre);

  return card(7, 'Equipo', wrap);
}
// ---- Paso 8: Detalle ----
function stepDetalle() {
  const wrap = document.createElement('div');

  function field(labelText, inputEl) {
    const f = document.createElement('div'); f.className = 'field';
    const l = document.createElement('label'); l.className = 'field-label'; l.textContent = labelText;
    f.appendChild(l); f.appendChild(inputEl); return f;
  }

  const cantInput = document.createElement('input'); cantInput.type = 'number'; cantInput.min = '0'; cantInput.step = 'any'; cantInput.value = form.cantidad;
  cantInput.oninput = () => { form.cantidad = cantInput.value; };
  wrap.appendChild(field('Cantidad', cantInput));

  const valInput = document.createElement('input'); valInput.type = 'number'; valInput.min = '0'; valInput.value = form.valorUnitario;
  valInput.oninput = () => { form.valorUnitario = valInput.value; };
  wrap.appendChild(field(`Valor unitario ($) ${form.equipoValorRef ? '· ref: $' + Number(form.equipoValorRef).toLocaleString('es-CO') : ''}`, valInput));

  const ingInput = document.createElement('input'); ingInput.type = 'date'; ingInput.value = form.fechaIngreso;
  ingInput.onchange = () => { form.fechaIngreso = ingInput.value; };
  wrap.appendChild(field('Fecha de ingreso a obra', ingInput));

  const salInput = document.createElement('input'); salInput.type = 'date'; salInput.value = form.fechaSalida;
  salInput.onchange = () => { form.fechaSalida = salInput.value; };
  wrap.appendChild(field('Fecha de salida (dejar vacío si el equipo sigue en obra)', salInput));

  const remSInput = document.createElement('input'); remSInput.type = 'text'; remSInput.value = form.remisionSalida;
  remSInput.oninput = () => { form.remisionSalida = remSInput.value; };
  wrap.appendChild(field('Código remisión de salida (opcional)', remSInput));

  const remLInput = document.createElement('input'); remLInput.type = 'text'; remLInput.value = form.remisionLlegada;
  remLInput.oninput = () => { form.remisionLlegada = remLInput.value; };
  wrap.appendChild(field('Código remisión de llegada/devolución (opcional)', remLInput));

  const obsArea = document.createElement('textarea'); obsArea.value = form.observaciones;
  obsArea.oninput = () => { form.observaciones = obsArea.value; };
  wrap.appendChild(field('Observaciones (opcional)', obsArea));

  return card(8, 'Detalle del equipo', wrap);
}

// ============================================================
// Footer / navegacion
// ============================================================
function renderFooter() {
  const footer = document.getElementById('footerInner');
  footer.innerHTML = '';
  if (step > 1) {
    const back = document.createElement('button'); back.className = 'btn btn-ghost'; back.type = 'button'; back.textContent = '←';
    back.onclick = () => { step -= 1; renderRegistro(); };
    footer.appendChild(back);
  }
  if (step < 8) {
    const info = document.createElement('div');
    info.style.cssText = 'flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-weight:600;font-size:13px;';
    info.textContent = 'Seleccione una opción de la lista para continuar';
    footer.appendChild(info);
  } else {
    const save = document.createElement('button'); save.className = 'btn btn-primary'; save.type = 'button';
    save.textContent = 'Guardar registro';
    save.disabled = !form.cantidad || form.cantidad <= 0;
    save.onclick = guardarRegistro;
    footer.appendChild(save);
  }
}

// ============================================================
// Guardar
// ============================================================
async function guardarRegistro() {
  const saveBtn = document.querySelector('.btn-primary');
  const backBtn = document.querySelector('.btn-ghost');
  if (saveBtn) saveBtn.disabled = true;
  if (backBtn) backBtn.disabled = true;

  const entry = {
    id: uid(),
    fechaSolicitud: form.fechaSolicitud,
    solicitante: form.solicitante,
    codfrente: form.codfrente,
    frenteNombre: frenteByCodigo[form.codfrente] ? frenteByCodigo[form.codfrente].nombre : '',
    codcap: form.codcap,
    codsubcap: form.codsubcap,
    codact: form.codact,
    actDesc: form.actDesc,
    proveedor: form.proveedor,
    equipo: form.equipo,
    equipoUnidad: form.equipoUnidad,
    cantidad: form.cantidad,
    valorUnitario: form.valorUnitario || null,
    fechaIngreso: form.fechaIngreso || null,
    fechaSalida: form.fechaSalida || null,
    remisionSalida: form.remisionSalida || null,
    remisionLlegada: form.remisionLlegada || null,
    observaciones: form.observaciones || null,
    creado: new Date().toISOString(),
  };

  const attemptLabels = ['Guardando…', 'Reintentando (2)…', 'Reintentando (3)…', 'Reintentando (4)…', 'Última vez (5)…'];
  let ok = false; let lastErr = null;
  const delays = [0, 700, 1600, 3000, 5000];
  for (let i = 0; i < 5 && !ok; i++) {
    if (saveBtn) saveBtn.textContent = attemptLabels[i];
    if (delays[i]) await sleep(delays[i]);
    try { await backendGuardar(entry); ok = true; }
    catch (e) {
      lastErr = e;
      console.error('intento', i + 1, 'fallo:', e && e.message);
      if (e && e.message && e.message.indexOf('CONFIG:') === 0) break;
    }
  }

  if (ok) {
    showToast('Registro guardado ✓');
    resetForm(true);
    renderRegistro();
  } else {
    const msg = (lastErr && lastErr.message && lastErr.message.indexOf('CONFIG:') === 0)
      ? 'Falta terminar de configurar la app (aviso para el administrador). Sus datos no se han perdido.'
      : 'La red/servidor está ocupado. Sus datos NO se perdieron: toque "Guardar" otra vez.';
    showToast(msg, true);
    if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'Guardar registro'; }
    if (backBtn) backBtn.disabled = false;
  }
}

// ============================================================
// Panel Admin
// ============================================================
let allEntries = [];

async function loadEntries() {
  document.getElementById('admKpis').innerHTML = '<div class="loading"><div class="spin"></div><br>Cargando registros…</div>';
  document.getElementById('admTbody').innerHTML = '';
  try {
    const entries = await backendListar();
    entries.sort((a, b) => (b.creado || '').localeCompare(a.creado || ''));
    allEntries = entries;
  } catch (e) {
    allEntries = [];
    console.error('error cargando registros:', e);
  }
  renderAdmin();
}

function enObra(e) { return e.fechaIngreso && !e.fechaSalida; }

function diasEnObra(e, hastaFecha) {
  if (!e.fechaIngreso) return 0;
  const ini = new Date(e.fechaIngreso);
  const fin = e.fechaSalida ? new Date(e.fechaSalida) : (hastaFecha ? new Date(hastaFecha) : new Date());
  const diff = Math.floor((fin - ini) / 86400000) + 1;
  return Math.max(0, diff);
}
function valorAcumulado(e, hastaFecha) {
  const dias = diasEnObra(e, hastaFecha);
  const valorDia = parseFloat(e.valorUnitario) || 0;
  const cant = parseFloat(e.cantidad) || 0;
  return dias * valorDia * cant;
}

function renderAdmin() {
  const from = document.getElementById('admFrom').value;
  const to = document.getElementById('admTo').value;
  let filtered = allEntries;
  if (from) filtered = filtered.filter(e => (e.fechaSolicitud || '') >= from);
  if (to) filtered = filtered.filter(e => (e.fechaSolicitud || '') <= to);

  const enObraCount = filtered.filter(enObra).length;
  const fechaCorte = document.getElementById('admCorte').value || todayISO();
  const valorAcumTotal = filtered.reduce((s, e) => s + valorAcumulado(e, fechaCorte), 0);
  const proveedoresActivos = new Set(filtered.filter(enObra).map(e => e.proveedor)).size;

  const kpis = document.getElementById('admKpis');
  kpis.innerHTML = '';
  const kpiData = [
    ['Equipos en obra ahora', enObraCount, true],
    [`Valor acumulado a ${fmtFecha(fechaCorte)} ($)`, valorAcumTotal.toLocaleString('es-CO', { maximumFractionDigits: 0 }), false],
    ['Registros', filtered.length, false],
    ['Proveedores activos', proveedoresActivos, false],
  ];
  kpiData.forEach(([label, val, accent]) => {
    const d = document.createElement('div'); d.className = 'kpi' + (accent ? ' accent' : '');
    d.innerHTML = `<div class="label">${label}</div><div class="value">${val}</div>`;
    kpis.appendChild(d);
  });

  // Valor acumulado por proveedor (para liquidacion mensual)
  const porProveedor = {};
  filtered.forEach(e => { porProveedor[e.proveedor] = (porProveedor[e.proveedor] || 0) + valorAcumulado(e, fechaCorte); });
  const maxH = Math.max(1, ...Object.values(porProveedor));
  const chart = document.getElementById('admChart');
  chart.innerHTML = '';
  Object.entries(porProveedor).sort((a, b) => b[1] - a[1]).forEach(([prov, val]) => {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<div class="lbl">${prov}</div><div class="track"><div class="fill" style="width:${(val / maxH * 100).toFixed(0)}%"></div></div><div class="val">$${Math.round(val).toLocaleString('es-CO')}</div>`;
    chart.appendChild(row);
  });
  if (!Object.keys(porProveedor).length) chart.innerHTML = '<div class="empty-hint">No hay registros en el rango seleccionado.</div>';

  document.getElementById('admCount').textContent = `(${filtered.length})`;
  const tbody = document.getElementById('admTbody');
  tbody.innerHTML = '';
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty-hint">Todavía no hay equipos registrados desde la Tablet.</td></tr>`;
  }
  filtered.slice(0, 300).forEach(e => {
    const tr = document.createElement('tr');
    const estado = enObra(e) ? '<span class="tag" style="background:var(--green)">En obra</span>' : (e.fechaSalida ? '<span class="tag" style="background:var(--ink-soft)">Devuelto</span>' : '<span class="tag" style="background:var(--orange)">Solicitado</span>');
    const dias = diasEnObra(e, fechaCorte);
    const val = valorAcumulado(e, fechaCorte);
    tr.innerHTML = `<td>${fmtFecha(e.fechaSolicitud)}</td>
      <td>${e.proveedor}<br><span style="color:var(--ink-soft);">${(e.equipo || '').slice(0, 40)}</span></td>
      <td><span class="tag">${e.codfrente}</span></td>
      <td>${estado}<br><span style="color:var(--ink-soft);font-size:11px;">${dias>0?dias+' días · $'+Math.round(val).toLocaleString('es-CO'):''}</span></td>
      <td>${e.solicitante}</td>
      <td>${e.remisionSalida || ''}</td>`;
    tbody.appendChild(tr);
  });
}

// ============================================================
// Modos
// ============================================================
// ============================================================
// Proteccion simple del Panel Admin con PIN
// NOTA: esto es una barrera práctica (evita que cualquiera toque el
// panel), NO seguridad real de nivel empresarial, ya que el código
// vive en el navegador y es técnicamente visible. Para control de
// acceso real se requiere un backend con usuarios (ver Power Apps).
// ============================================================
const ADMIN_PIN = "2026"; // <-- CAMBIA este PIN por el que prefieras
let adminUnlocked = false;

function pedirPin() {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(18,35,59,0.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;';
    overlay.innerHTML = `
      <div style="background:#fff;border-radius:14px;padding:24px;max-width:320px;width:100%;box-shadow:0 8px 28px rgba(0,0,0,0.25);">
        <div style="font-weight:800;font-size:16px;margin-bottom:6px;color:var(--ink)">Acceso al Panel Admin</div>
        <div style="font-size:13px;color:var(--ink-soft);margin-bottom:14px;">Ingrese el PIN de administrador.</div>
        <input id="pinInput" type="password" inputmode="numeric" placeholder="PIN" style="width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--line);font-size:18px;text-align:center;letter-spacing:4px;margin-bottom:12px;">
        <div id="pinError" style="color:var(--red);font-size:12.5px;margin-bottom:10px;display:none;">PIN incorrecto, intente de nuevo.</div>
        <div style="display:flex;gap:8px;">
          <button id="pinCancel" style="flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;">Cancelar</button>
          <button id="pinOk" style="flex:1;padding:12px;border-radius:10px;border:none;background:var(--orange);color:#fff;font-weight:800;">Entrar</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const input = overlay.querySelector('#pinInput');
    input.focus();
    function tryUnlock() {
      if (input.value === ADMIN_PIN) {
        overlay.remove();
        resolve(true);
      } else {
        overlay.querySelector('#pinError').style.display = 'block';
        input.value = ''; input.focus();
      }
    }
    overlay.querySelector('#pinOk').onclick = tryUnlock;
    input.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') tryUnlock(); });
    overlay.querySelector('#pinCancel').onclick = () => { overlay.remove(); resolve(false); };
  });
}

async function setMode(mode) {
  if (mode === 'admin' && !adminUnlocked) {
    const ok = await pedirPin();
    if (!ok) return;
    adminUnlocked = true;
  }
  document.getElementById('viewRegistro').classList.toggle('active', mode === 'registro');
  document.getElementById('viewAdmin').classList.toggle('active', mode === 'admin');
  document.getElementById('btnModeReg').classList.toggle('active', mode === 'registro');
  document.getElementById('btnModeAdmin').classList.toggle('active', mode === 'admin');
  document.getElementById('footerBar').style.display = mode === 'registro' ? 'block' : 'none';
  if (mode === 'admin') loadEntries();
}
document.getElementById('btnModeReg').onclick = () => setMode('registro');
document.getElementById('btnModeAdmin').onclick = () => setMode('admin');
document.getElementById('admFrom').addEventListener('change', renderAdmin);
document.getElementById('admTo').addEventListener('change', renderAdmin);
document.getElementById('admCorte').addEventListener('change', renderAdmin);

// tabla admin con 6 columnas (ajustar encabezados)
document.querySelector('#admTable thead tr').innerHTML =
  '<th>Fecha</th><th>Proveedor / Equipo</th><th>Frente</th><th>Estado (días · valor)</th><th>Solicitante</th><th>Remisión</th>';

document.getElementById('admCorte').value = todayISO();
renderRegistro();

</script>
