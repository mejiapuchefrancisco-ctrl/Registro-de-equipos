<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Campo · AIRPLAN T1 JMC</title>
<style>
  :root {
    --verde: #1A5632;
    --verde-oscuro: #0F331D;
    --verde-claro: #4C8A64;
    --dorado: #C9A227;
    --gris-borde: #D8DED9;
    --gris-texto: #3A3F3C;
    --fondo: #F5F7F5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--fondo); color: var(--gris-texto); padding-bottom: 90px;
  }
  header {
    background: var(--verde); color: white; padding: 14px 16px;
    display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 20;
  }
  header img { height: 34px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; }
  header p { margin: 0; font-size: 11px; opacity: .85; }
  main { padding: 14px; max-width: 560px; margin: 0 auto; }
  .card {
    background: white; border: 1px solid var(--gris-borde); border-radius: 10px;
    padding: 14px; margin-bottom: 14px;
  }
  .card h2 {
    font-size: 13px; text-transform: none; color: var(--verde-oscuro);
    margin: 0 0 10px 0; font-weight: 700;
  }
  label { display: block; font-size: 12.5px; color: var(--gris-texto); margin: 10px 0 4px; }
  label:first-child { margin-top: 0; }
  select, input[type=text], input[type=number], input[type=date] {
    width: 100%; padding: 10px 10px; border: 1.5px solid var(--gris-borde);
    border-radius: 8px; font-size: 15px; background: white; color: var(--gris-texto);
  }
  select:focus, input:focus { outline: none; border-color: var(--verde); }
  .fila { display: flex; gap: 8px; }
  .fila > div { flex: 1; }
  .persona-chip {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: #EEF3EF; border: 1px solid var(--gris-borde); border-radius: 8px;
    padding: 8px 10px; margin-top: 8px; flex-wrap: wrap;
  }
  .persona-chip .nombre { font-size: 13.5px; font-weight: 600; flex: 1; min-width: 120px; }
  .persona-chip .cargo { font-size: 11px; color: var(--gris-texto); opacity: .7; }
  .persona-chip input[type=number] { width: 62px; padding: 6px; font-size: 13px; }
  .persona-chip input[type=text] { width: 100px; padding: 6px; font-size: 12px; }
  .persona-chip select { width: auto; padding: 6px; font-size: 12px; }
  .hora-fin-auto {
    display: flex; flex-direction: column; gap: 3px; width: 100%;
    background: #FFFFFF; border: 1px solid var(--gris-borde); border-radius: 6px;
    padding: 8px; margin-top: 4px;
  }
  .hora-fin-auto label { font-size: 10.5px; color: var(--gris-texto); }
  .hora-fin-auto input[type=time] { padding: 6px; font-size: 13px; }
  .fila-horas { display: flex; align-items: center; gap: 6px; }
  .fila-horas input[type=time] { flex: 1; min-width: 0; }
  .fila-horas span { font-size: 11px; color: var(--gris-texto); }
  .resumen-auto {
    font-size: 12px; font-weight: 600; color: var(--verde-oscuro);
    background: #FBF3D9; border-radius: 5px; padding: 4px 7px; margin-top: 2px;
  }
  .resumen-auto.aviso { color: #8a6d00; background: #FFF3CD; font-weight: 500; }
  .manual-toggle {
    width: 100%; font-size: 11.5px; color: var(--gris-texto); margin-top: 2px;
  }
  .manual-toggle summary { cursor: pointer; padding: 4px 0; }
  .manual-toggle input, .manual-toggle select { margin-top: 6px; }
  .btn-x {
    background: none; border: none; color: #B4453A; font-size: 18px; cursor: pointer;
    padding: 0 4px; line-height: 1;
  }
  .buscador-personal { position: relative; margin-top: 10px; }
  .resultados {
    position: absolute; z-index: 10; background: white; border: 1px solid var(--gris-borde);
    border-radius: 8px; width: 100%; max-height: 180px; overflow-y: auto; box-shadow: 0 4px 10px rgba(0,0,0,.08);
  }
  .resultados div { padding: 9px 10px; font-size: 13.5px; cursor: pointer; border-bottom: 1px solid #F0F0F0; }
  .resultados div:hover { background: #EEF3EF; }
  .btn {
    display: inline-block; border: none; border-radius: 8px; padding: 11px 16px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn-primario { background: var(--verde); color: white; width: 100%; }
  .btn-primario:disabled { background: #A9BBAE; }
  .btn-secundario { background: white; color: var(--verde); border: 1.5px solid var(--verde); width: 100%; }
  .btn-agregar-bloque {
    background: #EEF3EF; color: var(--verde-oscuro); border: 1.5px dashed var(--verde-claro);
    width: 100%; padding: 12px; margin-top: 6px;
  }
  .bloque { border-top: 2px solid var(--dorado); padding-top: 12px; margin-top: 16px; position: relative; }
  .bloque:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  .bloque-num { font-size: 11px; color: var(--dorado); font-weight: 700; margin-bottom: 6px; letter-spacing: .3px; }
  .quitar-bloque { position: absolute; right: 0; top: 0; }
  .barra-inferior {
    position: fixed; bottom: 0; left: 0; right: 0; background: white;
    border-top: 1px solid var(--gris-borde); padding: 10px 14px; z-index: 20;
  }
  .aviso {
    background: #FBF3D9; border: 1px solid var(--dorado); border-radius: 8px;
    padding: 10px 12px; font-size: 12.5px; margin-bottom: 14px; color: var(--verde-oscuro);
  }
  .toast {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
    background: var(--verde-oscuro); color: white; padding: 12px 20px; border-radius: 8px;
    font-size: 14px; z-index: 30; display: none; max-width: 90%; text-align: center;
  }
  .vacio { text-align: center; color: #8A948E; font-size: 13px; padding: 20px 0; }
  .campo-libre { font-size: 11px; color: var(--verde); background: none; border: none; cursor: pointer; padding: 4px 0; text-decoration: underline; }

  .interruptor {
    display: flex; background: #EEF3EF; border-radius: 10px; padding: 4px;
    margin-bottom: 14px; gap: 4px;
  }
  .interruptor button {
    flex: 1; border: none; background: none; padding: 10px; border-radius: 8px;
    font-size: 14px; font-weight: 700; color: var(--verde-oscuro); cursor: pointer;
  }
  .interruptor button.activo { background: var(--verde); color: white; }

  .equipo-fila {
    background: #EEF3EF; border: 1px solid var(--gris-borde); border-radius: 8px;
    padding: 10px; margin-top: 8px; position: relative;
  }
  .equipo-fila .quitar-equipo { position: absolute; right: 8px; top: 8px; }
  .equipo-fila .fila { margin-top: 8px; }

  .caja-codigos {
    background: #FBF3D9; border: 1.5px solid var(--dorado); border-radius: 8px;
    padding: 12px; margin-top: 10px; font-size: 15px; color: var(--verde-oscuro);
  }
  .caja-codigos b { color: var(--verde-oscuro); }
  .caja-codigos div { margin-bottom: 4px; }
  .nota-caja-codigos { font-size: 11px; color: var(--gris-texto); margin-top: 6px !important; font-weight: normal; }

  /* ---------- v2: jornada ---------- */
  .contador { background: var(--verde); color: white; border-radius: 10px; padding: 1px 8px; font-size: 11px; margin-left: 4px; }
  .nota-h { font-weight: 400; color: #6B756F; font-size: 11.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 16px; padding: 7px 12px; font-size: 13px;
          border: 1.5px solid var(--gris-borde); background: white; color: var(--gris-texto); cursor: pointer; font-family: inherit; }
  .chip.on { background: #E3EEE6; border-color: var(--verde-claro); color: var(--verde-oscuro); font-weight: 600; }
  .chip.off { background: #F3F4F3; color: #9AA39D; text-decoration: line-through; }
  .chip.rec { background: #FBF3D9; border-color: var(--dorado); color: var(--verde-oscuro); text-align: left; }
  .chip button { background: none; border: none; color: #B4453A; font-size: 14px; cursor: pointer; padding: 0 0 0 2px; }
  .vacio-inline { color: #8A948E; font-size: 13px; }
  .btn-suave { background: #EEF3EF; color: var(--verde-oscuro); border: 1.5px solid var(--verde-claro); width: 100%; margin-top: 8px; }
  .nota { font-size: 11.5px; color: #6B756F; margin: 6px 0 0; }
  .linea { border: 1.5px solid var(--gris-borde); border-left: 4px solid var(--verde); border-radius: 8px; padding: 10px; margin-bottom: 10px; background: white; }
  .linea.incompleta { border-left-color: var(--dorado); }
  .linea-top { display: flex; align-items: center; gap: 6px; }
  .linea-top input[type=time] { width: auto; flex: 1; min-width: 0; padding: 8px 6px; font-size: 15px; border: 1.5px solid var(--gris-borde); border-radius: 8px; }
  .linea-top span { font-size: 12px; }
  .linea-top .dur { font-weight: 700; color: var(--verde-oscuro); min-width: 42px; text-align: right; }
  .act-elegida { margin-top: 8px; cursor: pointer; }
  .act-titulo { font-size: 14px; font-weight: 600; color: var(--verde-oscuro); }
  .act-sub { font-size: 11.5px; color: #6B756F; }
  .tag-np { background: #FBF3D9; color: #7A5E00; border-radius: 6px; padding: 1px 6px; font-size: 10.5px; font-weight: 600; }
  .picker { background: #F7F9F7; border: 1px dashed var(--verde-claro); border-radius: 8px; padding: 10px; margin-top: 8px; }
  .lista-act div { background: white; border: 1px solid var(--gris-borde); border-radius: 8px; padding: 8px 10px; margin-top: 6px; cursor: pointer; }
  .lista-act div:active { background: #E3EEE6; }
  .lista-act b { display: block; font-size: 13px; color: var(--verde-oscuro); }
  .lista-act span { font-size: 11px; color: #6B756F; }
  details.np { margin-top: 10px; font-size: 13px; }
  details.np summary { cursor: pointer; color: #7A5E00; font-weight: 600; padding: 4px 0; }
  .chips-linea { margin-top: 10px; }
  .chips-linea .chip { padding: 5px 10px; font-size: 12px; }
  .cant-fila { border-top: 1px solid #EEF1EE; padding: 8px 0; }
  .cant-fila:first-of-type { border-top: none; }
  .cant-nombre { font-size: 13.5px; font-weight: 600; color: var(--verde-oscuro); margin-bottom: 6px; }
  .cant-inputs { display: flex; gap: 6px; align-items: center; }
  .cant-inputs input { width: 90px !important; flex: none; }
  .cant-inputs .unidad { font-size: 13px; font-weight: 600; min-width: 24px; }
  .cant-inputs select { flex: 1; min-width: 0; font-size: 13px; padding: 9px 6px; }
  table.resumen { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.resumen th { text-align: left; font-size: 11.5px; color: #6B756F; font-weight: 600; padding: 4px 0; border-bottom: 1px solid var(--gris-borde); }
  table.resumen td { padding: 6px 0; border-bottom: 1px solid #F0F2F0; }
  table.resumen tr.error td { color: #B4453A; font-weight: 600; }
  .extra { color: #7A5E00; font-weight: 600; }
  button:disabled { opacity: .55; }
  .fecha-rapida { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .fecha-rapida button { border: 1.5px solid var(--verde-claro); background: white; color: var(--verde-oscuro);
    border-radius: 18px; padding: 7px 16px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .fecha-rapida button.activo { background: var(--verde); color: white; border-color: var(--verde); }
  #fechaTxt { font-size: 13.5px; font-weight: 700; color: var(--verde-oscuro); }
  .aviso-fecha { background: #FFF3CD; border: 1.5px solid var(--dorado); border-radius: 8px; padding: 10px 12px;
    font-size: 13px; color: #5C4600; margin-bottom: 10px; }
  .aviso-fecha button { margin-top: 8px; width: 100%; background: var(--dorado); color: #1E2A22; border: none;
    border-radius: 8px; padding: 10px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .interruptor button { font-size: 13.5px; }
  .bus-resultado { background: #FBF3D9; border: 1.5px solid var(--dorado); border-radius: 10px; padding: 14px; margin-top: 12px; }
  .bus-codigos { display: flex; gap: 10px; }
  .bus-codigos > div { flex: 1; background: white; border-radius: 8px; padding: 10px; text-align: center; }
  .bus-codigos small { display: block; font-size: 10.5px; color: #6B756F; font-weight: 600; letter-spacing: .3px; }
  .bus-codigos b { display: block; font-size: 22px; color: var(--verde-oscuro); margin-top: 2px; }
  .bus-desc { font-size: 13px; color: var(--verde-oscuro); margin-top: 10px; line-height: 1.4; }
  .bus-ruta { font-size: 11.5px; color: #6B756F; margin-top: 8px; line-height: 1.4; }
  .btn-copiar { margin-top: 10px; }
</style>
</head>
<body>

<header>
  <img src="aia.png" alt="AIA" onerror="this.style.display='none'">
  <div>
    <h1 id="tituloApp">Registro de Campo</h1>
    <p>AIRPLAN T1 JMC · Diligenciamiento diario</p>
  </div>
</header>

<div class="toast" id="toast"></div>

<main>

  <div class="interruptor">
    <button id="btnModoPersonal" class="activo" onclick="cambiarModo('personal')">👷 Jornada</button>
    <button id="btnModoBuscador" onclick="cambiarModo('buscador')">🔎 Buscar códigos</button>
    <button id="btnModoEquipos" onclick="cambiarModo('equipos')" style="display:none">🚜 Equipos</button>
    <button id="btnModoMateriales" onclick="cambiarModo('materiales')" style="display:none">📦 Materiales</button>
  </div>

  <div class="card" id="cardQuien">
    <h2 id="tituloPaso1">1. ¿Quién eres?</h2>
    <label for="selMaestro" id="labelPaso1">Busca tu nombre</label>
    <select id="selMaestro" onchange="onMaestroChange()">
      <option value="">— Selecciona tu nombre —</option>
    </select>

    <label for="fecha">Fecha</label>
    <input type="date" id="fecha" onchange="alCambiarFecha()">
    <div class="fecha-rapida">
      <button type="button" id="btnHoy" onclick="ponerFecha(0)">Hoy</button>
      <button type="button" id="btnAyer" onclick="ponerFecha(-1)">Ayer</button>
      <span id="fechaTxt"></span>
    </div>
  </div>

  <div id="zonaJornada"></div>
  <div id="zonaBuscador" style="display:none"></div>
  <div id="zonaBloques" style="display:none"></div>

  <button class="btn btn-agregar-bloque" id="btnAgregarBloque" onclick="agregarBloque()" disabled style="display:none">
    + Agregar otro bloque de actividad
  </button>

  <div style="height: 90px"></div>
</main>

<div class="barra-inferior" id="barraGuardar">
  <button class="btn btn-primario" id="btnGuardar" onclick="guardarTodo()" disabled>
    Guardar el día
  </button>
</div>

<script>
// =================== CONFIGURACIÓN ===================
// Reemplaza esta URL por la de tu Google Apps Script publicado (ver instrucciones).
const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbygQ9lgDfHZulIjanGB_WwC9-5y3JyJ9gSmQIKJ2ccOlbkWhZOTs3ipXFqKaHK_B5oz/exec";
// =======================================================

const PROVEEDORES_SUGERIDOS = ["ALDECCO", "MAS EQUIPOS", "EQUIPOS INMEDIATOS"];
const UNIDADES_SUGERIDAS = ["Und", "m2", "m3", "Día", "Hora", "Global"];

let CATALOGO = null;
let maestroActual = null;
let bloques = [];
let contadorBloque = 0;
let modo = "personal"; // "personal" | "equipos"

async function cargarCatalogo() {
  const resp = await fetch("catalogo.json");
  CATALOGO = await resp.json();
  poblarMaestros();
  const hoy = new Date(); hoy.setMinutes(hoy.getMinutes() - hoy.getTimezoneOffset());
  document.getElementById("fecha").value = hoy.toISOString().slice(0, 10);
  actualizarFechaTxt();
  renderJornada();
}

function cambiarModo(nuevoModo) {
  if (nuevoModo === modo) return;
  modo = nuevoModo;
  document.getElementById("btnModoPersonal").classList.toggle("activo", modo === "personal");
  document.getElementById("btnModoEquipos").classList.toggle("activo", modo === "equipos");
  document.getElementById("btnModoMateriales").classList.toggle("activo", modo === "materiales");
  document.getElementById("btnModoBuscador").classList.toggle("activo", modo === "buscador");
  const titulos = { buscador: "Buscador de códigos", personal: "Jornada: horas y cantidades", equipos: "Registro de Equipos", materiales: "Pedido de Materiales" };
  const paso1 = { buscador: "", personal: "1. ¿Quién eres?", equipos: "1. ¿Quién solicita el equipo?", materiales: "1. ¿Quién solicita el material?" };
  const btnTexto = { buscador: "", personal: "+ Agregar otro bloque de actividad", equipos: "+ Agregar otro bloque de equipos", materiales: "+ Agregar otro bloque de materiales" };
  document.getElementById("tituloApp").textContent = titulos[modo];
  document.getElementById("tituloPaso1").textContent = paso1[modo];
  document.getElementById("labelPaso1").textContent = "Busca tu nombre";
  document.getElementById("btnAgregarBloque").textContent = btnTexto[modo];
  // Al cambiar de modo reiniciamos los bloques para no mezclar datos
  bloques = [];
  contadorBloque = 0;
  const esJornada = modo === "personal", esBuscador = modo === "buscador";
  document.getElementById("zonaJornada").style.display = esJornada ? "" : "none";
  document.getElementById("zonaBuscador").style.display = esBuscador ? "" : "none";
  document.getElementById("zonaBloques").style.display = (esJornada || esBuscador) ? "none" : "";
  document.getElementById("btnAgregarBloque").style.display = (esJornada || esBuscador) ? "none" : "";
  document.getElementById("cardQuien").style.display = esBuscador ? "none" : "";
  document.getElementById("barraGuardar").style.display = esBuscador ? "none" : "";
  if (esBuscador) { renderBuscador(); }
  else if (esJornada) { renderJornada(); } else { if (maestroActual) agregarBloque(); renderBloques(); }
  actualizarBotonGuardar();
}

function poblarMaestros() {
  const sel = document.getElementById("selMaestro");
  const maestros = CATALOGO.personal
    .filter(p => (p.cargo || "").toLowerCase().includes("maestro"))
    .sort((a, b) => a.nombre.localeCompare(b.nombre));
  maestros.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p.nombre;
    opt.textContent = `${p.nombre} (${p.cargo})`;
    sel.appendChild(opt);
  });
}

function onMaestroChange() {
  const nombre = document.getElementById("selMaestro").value;
  maestroActual = CATALOGO.personal.find(p => p.nombre === nombre) || null;
  document.getElementById("btnAgregarBloque").disabled = !maestroActual;
  actualizarBotonGuardar();
  if (modo === "personal") { iniciarJornada(); return; }
  if (maestroActual && bloques.length === 0) agregarBloque();
}

function frentesDelMaestro() {
  if (!maestroActual) return [];
  const propios = CATALOGO.residenteFrente.filter(rf => rf.residenteKey === maestroActual.residenteKey);
  const codsPropios = new Set(propios.map(p => p.codFrente));
  const listaPropia = CATALOGO.frentes.filter(f => codsPropios.has(f.cod));
  return listaPropia;
}

function unidadActividad(b) {
  const a = CATALOGO.actividades.find(x => x.cod === b.codActividad);
  return a ? a.unidad : "";
}

function actualizarCantidadBloque(idBloque, valor) {
  const b = bloques.find(x => x.id === idBloque);
  b.cantidadEjecutada = valor;
}

function agregarBloque() {
  contadorBloque++;
  bloques.push({
    id: contadorBloque, codFrente: "", codCapitulo: "", codSubcap: "", codActividad: "",
    personas: [], equipos: [], materiales: [], cantidadEjecutada: "",
    loteId: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
  });
  renderBloques();
}

function quitarBloque(id) {
  bloques = bloques.filter(b => b.id !== id);
  renderBloques();
}

function renderBloques() {
  const zona = document.getElementById("zonaBloques");
  zona.innerHTML = "";
  bloques.forEach((b, idx) => {
    const div = document.createElement("div");
    div.className = "card bloque";
    div.innerHTML = `
      ${bloques.length > 1 ? `<button class="btn-x quitar-bloque" onclick="quitarBloque(${b.id})">✕</button>` : ""}
      <div class="bloque-num">BLOQUE ${idx + 1}</div>

      <label>Frente de trabajo</label>
      <select onchange="cambiarFrente(${b.id}, this.value)">
        <option value="">— Selecciona el frente —</option>
        ${frenteOpciones(b)}
      </select>

      ${b.codFrente ? `
      <label>Capítulo</label>
      <select onchange="cambiarCapitulo(${b.id}, this.value)">
        <option value="">— Selecciona el capítulo —</option>
        ${capituloOpciones(b)}
      </select>` : ""}

      ${b.codCapitulo ? `
      <label>Subcapítulo</label>
      <select onchange="cambiarSubcap(${b.id}, this.value)">
        <option value="">— Selecciona el subcapítulo —</option>
        ${subcapOpciones(b)}
      </select>` : ""}

      ${b.codSubcap ? `
      <label>Actividad</label>
      <select onchange="cambiarActividad(${b.id}, this.value)">
        <option value="">— Selecciona la actividad —</option>
        ${actividadOpciones(b)}
      </select>` : ""}

      ${b.codActividad && modo === "personal" ? `
      <label>Cantidad ejecutada hoy en esta actividad ${unidadActividad(b) ? '(' + unidadActividad(b) + ')' : ''}</label>
      <input type="number" min="0" step="0.01" value="${b.cantidadEjecutada || ''}"
             placeholder="Ej. 2.5" oninput="actualizarCantidadBloque(${b.id}, this.value)">

    html += `<option value="${f.cod}" ${b.codFrente === f.cod ? "selected" : ""}>${f.nombre}</option>`;

// ============ CÁLCULO AUTOMÁTICO DE HORAS (hora inicio + hora fin) ============
// Cuota de horas ORDINARIAS según el día de la semana (a partir de la hora
// en que la persona inició su turno — no se asume que todos entran a las 7am,
// para poder registrar bien los turnos nocturnos):
//   Lunes a Jueves: 8h ordinarias (ej. 7am-3pm), luego extra
//   Viernes:        7.5h ordinarias (ej. 7am-2:30pm), luego extra
//   Sábado:         5h ordinarias (ej. 7am-12m), luego extra —
//                   salvo que esa semana tenga un festivo, en cuyo caso
//                   el sábado completo es extra (0h ordinarias).
//   Domingo:        0h ordinarias — TODO lo trabajado es extra.
//
// Recargo nocturno: 19:00 a 06:00 (Ley 2466 de 2025, vigente desde dic-2025)
// Domingo Y festivos: usa las tarifas "Dominical/Festivo ..." automáticamente.
const FESTIVOS_COLOMBIA_2026 = [
  "2026-01-01", "2026-01-12", "2026-03-23", "2026-04-02", "2026-04-03",
  "2026-05-01", "2026-05-18", "2026-06-08", "2026-06-15", "2026-06-29",
  "2026-07-20", "2026-08-07", "2026-08-17", "2026-10-12", "2026-11-02",
  "2026-11-16", "2026-12-08", "2026-12-25",
];

function esFestivoColombia(fechaStr) {
  return FESTIVOS_COLOMBIA_2026.includes(fechaStr);
}

function semanaTieneFestivo(fechaStr) {
  // ¿Algún día de lunes a sábado de la semana de 'fechaStr' es festivo?
  // (para decidir si el sábado de esa semana cuenta como todo extra o no)
  const fecha = new Date(fechaStr + "T00:00:00");
  const diasDesdeElLunes = (fecha.getDay() + 6) % 7; // lunes=0 ... domingo=6
  const lunes = new Date(fecha);
  lunes.setDate(fecha.getDate() - diasDesdeElLunes);
  for (let i = 0; i < 6; i++) { // lunes(0) a sábado(5)
    const d = new Date(lunes);
    d.setDate(lunes.getDate() + i);
    const dStr = d.toISOString().slice(0, 10);
    if (esFestivoColombia(dStr)) return true;
  }
  return false;
}

function esHoraNocturna(horaAbsoluta) {
  const h = ((horaAbsoluta % 24) + 24) % 24;
  return h >= 19 || h < 6;
}

function nombreTipoHora(esOrdinaria, esNocturna, esDominicalFestivo) {
  if (esDominicalFestivo) {
    if (esOrdinaria) return esNocturna ? "Dominical/Festivo Ordinaria Nocturna" : "Dominical/Festivo Ordinaria Diurna";
    return esNocturna ? "Dominical/Festivo Extra Nocturna" : "Dominical/Festivo Extra Diurna";
  }
  if (esOrdinaria) return esNocturna ? "Recargo Nocturno (Ordinaria)" : "Ordinaria Diurna";
  return esNocturna ? "Extra Nocturna" : "Extra Diurna";
}

function calcularSegmentosHora(fechaStr, horaInicioStr, horaFinStr) {
  if (!fechaStr || !horaInicioStr || !horaFinStr) return null;
  const fecha = new Date(fechaStr + "T00:00:00");
  const diaSemana = fecha.getDay(); // 0=domingo,1=lunes,...,6=sábado

  const [hIni, mIni] = horaInicioStr.split(":").map(Number);
  const [hFin, mFin] = horaFinStr.split(":").map(Number);
  const inicio = hIni + (mIni || 0) / 60;
  let fin = hFin + (mFin || 0) / 60;
  if (fin <= inicio) fin += 24; // el turno cruza la medianoche (trabajo nocturno)
  if (fin - inicio > 24) return null; // dato improbable / error de digitación

  const esDominicalFestivo = (diaSemana === 0) || esFestivoColombia(fechaStr);

  // Cuota de horas ORDINARIAS del día (a partir de la hora en que inició el turno):
  //   Lunes a Jueves: 8h ordinarias (ej. 7am-3pm), luego extra
  //   Viernes:        7.5h ordinarias (ej. 7am-2:30pm), luego extra
  //   Sábado:         5h ordinarias (ej. 7am-12m), luego extra —
  //                   PERO si esa semana (lunes a sábado) tiene un festivo,
  //                   el sábado completo cuenta como extra (0h ordinarias).
  //   Domingo:        0h ordinarias — todo lo trabajado es extra.
  let cuotaOrdinaria;
  if (diaSemana >= 1 && diaSemana <= 4) cuotaOrdinaria = 8;         // lunes a jueves
  else if (diaSemana === 5) cuotaOrdinaria = 7.5;                    // viernes
  else if (diaSemana === 6) cuotaOrdinaria = semanaTieneFestivo(fechaStr) ? 0 : 5; // sábado
  else cuotaOrdinaria = 0;                                           // domingo

  const finOrdinaria = inicio + cuotaOrdinaria;

  // Puntos de quiebre: inicio/fin del turno, fin de la cuota ordinaria, y
  // cada transición 19:00/06:00 (nocturno) que caiga dentro del turno.
  const puntos = new Set([inicio, fin, finOrdinaria]);
  for (let k = -1; k * 24 <= fin + 24; k++) {
    const t19 = k * 24 + 19, t6 = k * 24 + 6;
    if (t19 > inicio && t19 < fin) puntos.add(t19);
    if (t6 > inicio && t6 < fin) puntos.add(t6);
  }
  const cortes = [...puntos].filter(p => p >= inicio - 1e-9 && p <= fin + 1e-9).sort((a, b) => a - b);

  const totales = {};
  for (let i = 0; i < cortes.length - 1; i++) {
    const ini = cortes[i], finTramo = cortes[i + 1];
    const dur = finTramo - ini;
    if (dur <= 1e-9) continue;
    const medio = (ini + finTramo) / 2;
    const esOrdinaria = ini < finOrdinaria - 1e-9;
    const esNocturna = esHoraNocturna(medio);
    const tipo = nombreTipoHora(esOrdinaria, esNocturna, esDominicalFestivo);
    totales[tipo] = (totales[tipo] || 0) + dur;
  }
  return Object.entries(totales)
    .filter(([, h]) => h > 0.001)
    .map(([tipoHora, horas]) => ({ tipoHora, horas: Math.round(horas * 100) / 100 }));
}

function actualizarBotonGuardar() {
  if (modo === "buscador") return;
  let listo;
  if (modo === "personal") {
    listo = maestroActual && jornada.lineas.length > 0;
    const n = listo ? construirFilasJornada().length : 0;
    document.getElementById("btnGuardar").textContent = n ? `Guardar el día · ${n} registros` : "Guardar el día";
  } else if (modo === "equipos") {
    listo = maestroActual && bloques.some(b => b.codActividad && b.equipos.length > 0);
  } else {
    listo = maestroActual && bloques.some(b => b.codActividad && b.materiales.length > 0);
  }
  document.getElementById("btnGuardar").disabled = !listo;
}

async function guardarTodo() {
  if (modo === "personal") { return guardarJornada(); }
  const fecha = document.getElementById("fecha").value;
  const filas = [];

  if (modo === "personal") {
    bloques.forEach(b => {
      if (!b.codActividad || !b.personas.length) return;
      const frente = CATALOGO.frentes.find(f => f.cod === b.codFrente);
      const actividad = CATALOGO.actividades.find(a => a.cod === b.codActividad);
      b.personas.forEach(p => {
        const base = {
          fecha: fecha,
          nombre: p.nombre,
          cargo: p.cargo,
          residente: maestroActual.residente,
          codfrente: b.codFrente,
          frenteNombre: frente ? frente.nombre : "",
          codcap: b.codCapitulo,
          codsubcap: b.codSubcap,
          codact: b.codActividad,
          actDesc: actividad ? actividad.desc : "",
          actUnidad: actividad ? actividad.unidad : "",
          cantidad: b.cantidadEjecutada || null,
          loteId: b.loteId,
          observaciones: p.cargo === "Sin confirmar" ? "Persona registrada manualmente, confirmar cargo y cédula" : "",
          creado: new Date().toISOString(),
          registradoPor: maestroActual.nombre,
        };
        // Si tiene "hora de finalización" (lunes a sábado), se parte en varias
        // filas automáticamente (Ordinaria/Extra/Nocturna según corresponda).
        // Si no (o es domingo), se guarda tal cual quedó en horas/tipoHora manual.
        const segmentos = calcularSegmentosHora(fecha, p.horaIni, p.horaFin);
        if (segmentos) {
          segmentos.forEach((seg, i) => {
            filas.push({
              id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}_${i}`,
              ...base,
              horas: seg.horas,
              tipoHora: seg.tipoHora,
            });
          });
        } else {
          filas.push({
            id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
            ...base,
            horas: parseFloat(p.horas) || 0,
            tipoHora: p.tipoHora,
          });
        }
      });
    });
  } else if (modo === "equipos") {
    bloques.forEach(b => {
      if (!b.codActividad || !b.equipos.length) return;
      const frente = CATALOGO.frentes.find(f => f.cod === b.codFrente);
      const actividad = CATALOGO.actividades.find(a => a.cod === b.codActividad);
      b.equipos.forEach(eq => {
        filas.push({
          id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
          fecha: fecha,
          solicitante: maestroActual.nombre,
          codfrente: b.codFrente,
          frenteNombre: frente ? frente.nombre : "",
          codcap: b.codCapitulo,
          codsubcap: b.codSubcap,
          codact: b.codActividad,
          actDesc: actividad ? actividad.desc : "",
          proveedor: eq.proveedor,
          equipo: eq.equipo,
          unidad: eq.unidad,
          cantidad: parseFloat(eq.cantidad) || 0,
          valorUnitario: eq.valorUnitario ? parseFloat(eq.valorUnitario) : null,
          observaciones: "",
          creado: new Date().toISOString(),
        });
      });
    });
  } else {
    bloques.forEach(b => {
      if (!b.codActividad || !b.materiales.length) return;
      const frente = CATALOGO.frentes.find(f => f.cod === b.codFrente);
      const actividad = CATALOGO.actividades.find(a => a.cod === b.codActividad);
      b.materiales.forEach(m => {
        filas.push({
          id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
          fecha: fecha,
          solicitante: maestroActual.nombre,
          codfrente: b.codFrente,
          frenteNombre: frente ? frente.nombre : "",
          codcap: b.codCapitulo,
          codsubcap: b.codSubcap,
          codact: b.codActividad,
          actDesc: actividad ? actividad.desc : "",
          material: m.material,
          cantidad: parseFloat(m.cantidad) || 0,
          unidad: m.unidad,
          creado: new Date().toISOString(),
        });
      });
    });
  }

  if (!filas.length) { mostrarToast("No hay nada para guardar todavía"); return; }

  document.getElementById("btnGuardar").disabled = true;
  document.getElementById("btnGuardar").textContent = "Guardando…";

  try {
    await fetch(URL_APPS_SCRIPT, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ registros: filas, hoja: modo === "equipos" ? "Equipos" : (modo === "materiales" ? "Materiales" : "Registros") }),
    });
    mostrarToast(`✔ Guardado: ${filas.length} registro(s) del día`);
    bloques = [];
    contadorBloque = 0;
    agregarBloque();
  } catch (e) {
    mostrarToast("No se pudo guardar. Revisa tu conexión e intenta de nuevo.");
  }
  document.getElementById("btnGuardar").textContent = "Guardar el día";
  actualizarBotonGuardar();
}

function mostrarToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => { t.style.display = "none"; }, 3500);
}

const normTxt = s => (s || "").toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const esc = s => (s || "").toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const claveLS = sufijo => `jmc_${sufijo}_${maestroActual ? maestroActual.nombre : "x"}`;
function lsGet(k, def) { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

function iniciarJornada() {
  jornada = { frenteDia: "", cuadrilla: [], lineas: [], cantidades: {} };
  contLinea = 0;
  const propios = frentesDelMaestro();
  jornada.frenteDia = lsGet(claveLS("frente"), "") || (propios[0] ? propios[0].cod : "");
  renderJornada();
}

function renderJornada() {
  const z = document.getElementById("zonaJornada");
  if (!maestroActual) { z.innerHTML = `<div class="vacio">Selecciona tu nombre para empezar</div>`; actualizarBotonGuardar(); return; }
  const previa = lsGet(claveLS("cuadrilla"), []);
  z.innerHTML = `
    <div class="card">
      <h2>2. Frente principal del día</h2>
      <select onchange="jornada.frenteDia=this.value; lsSet(claveLS('frente'), this.value); renderJornada()">
        ${frenteOpciones({ codFrente: jornada.frenteDia })}
      </select>
    </div>

    <div class="card">
      <h2>3. Cuadrilla de hoy <span class="contador">${jornada.cuadrilla.length}</span></h2>
      <div class="chips">${jornada.cuadrilla.map(p => `
        <span class="chip on">${esc(nombreCorto(p.nombre))}
          <button aria-label="Quitar" onclick='quitarDeCuadrilla(${JSON.stringify(p.nombre)})'>✕</button></span>`).join("") || `<span class="vacio-inline">Nadie todavía</span>`}
      </div>
      ${previa.length && !jornada.cuadrilla.length ? `<button class="btn btn-suave" onclick="usarCuadrillaPrevia()">Usar la cuadrilla de la última vez (${previa.length})</button>` : ""}

function nombreCorto(n) { const p = n.split(" ").filter(Boolean); return p.length > 2 ? `${p[0]} ${p[p.length >= 4 ? 2 : 1]}` : n; }

// ---------- Cuadrilla ----------
function buscarParaCuadrilla(txt) {
  const cont = document.getElementById("resCuadrilla");
  if (!txt || txt.length < 2) { cont.style.display = "none"; return; }
  const t = normTxt(txt);
  const ya = new Set(jornada.cuadrilla.map(p => p.nombre));
  const enc = CATALOGO.personal.filter(p => normTxt(p.nombre).includes(t) && !ya.has(p.nombre)).slice(0, 8);
  if (!enc.length) { cont.style.display = "none"; return; }
  cont.innerHTML = enc.map(p => `<div onclick='agregarACuadrilla(${JSON.stringify(p.nombre)}, ${JSON.stringify(p.cargo)})'>${esc(p.nombre)} <span style="color:#999">(${esc(p.cargo)})</span></div>`).join("");
  cont.style.display = "block";
}
function agregarACuadrilla(nombre, cargo) {
  if (jornada.cuadrilla.some(p => p.nombre === nombre)) return;
  jornada.cuadrilla.push({ nombre, cargo });
  jornada.lineas.forEach(l => { if (l.todos) l.personas.push(nombre); });
  renderJornada();
  setTimeout(() => { const i = document.getElementById("buscaCuadrilla"); if (i) i.focus(); }, 0);
}
function agregarLibreCuadrilla() {
  const nombre = prompt("Escribe el nombre completo de la persona:");
  if (nombre && nombre.trim()) agregarACuadrilla(nombre.trim().toUpperCase(), "Sin confirmar");
}
function quitarDeCuadrilla(nombre) {
  jornada.cuadrilla = jornada.cuadrilla.filter(p => p.nombre !== nombre);
  jornada.lineas.forEach(l => { l.personas = l.personas.filter(n => n !== nombre); });
  renderJornada();
}
function usarCuadrillaPrevia() {
  const previa = lsGet(claveLS("cuadrilla"), []);
  previa.forEach(p => { if (!jornada.cuadrilla.some(x => x.nombre === p.nombre)) jornada.cuadrilla.push(p); });
  renderJornada();
}

// ---------- Líneas de actividad ----------
function ultimaHoraFin() {
  const conFin = jornada.lineas.filter(l => l.horaFin);
  return conFin.length ? conFin[conFin.length - 1].horaFin : "";
}
function agregarLinea() {
  contLinea++;
  const ini = ultimaHoraFin() || "07:00";
  jornada.lineas.push({
    id: contLinea, horaIni: ini, horaFin: "", codFrente: jornada.frenteDia,
    codAct: "", np: null, // np = { cat, desc } si es no presupuestada
    personas: jornada.cuadrilla.map(p => p.nombre), todos: true,
    loteId: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
  });
  lineaEnPicker = contLinea;
  renderJornada();
}
function quitarLinea(id) { jornada.lineas = jornada.lineas.filter(l => l.id !== id); if (lineaEnPicker === id) lineaEnPicker = null; renderJornada(); }
function setLinea(id, campo, valor) {
  const l = jornada.lineas.find(x => x.id === id); l[campo] = valor;
  if (campo === "horaIni" || campo === "horaFin" || campo === "codFrente") renderJornada();
}
function togglePersonaLinea(id, nombre) {
  const l = jornada.lineas.find(x => x.id === id);
  l.personas = l.personas.includes(nombre) ? l.personas.filter(n => n !== nombre) : [...l.personas, nombre];
  l.todos = l.personas.length === jornada.cuadrilla.length;
  renderJornada();
}
function catDeLinea(l) { return l.np ? l.np.cat : (CAT_SINCO[l.codAct] || null); }
function textoActividad(l) {
  if (l.np) return { titulo: l.np.desc || "(sin descripción)", sub: `No presupuestada · ${l.np.cat} ${CATEGORIAS[l.np.cat].nombre}`, np: true };
  const a = CATALOGO.actividades.find(x => x.cod === l.codAct);
  if (!a) return null;
  const c = CAT_SINCO[a.cod];
  return { titulo: a.desc.split("(")[0].trim().slice(0, 90), sub: `${a.cod}${c ? " · categoría " + c : ""}`, np: false };
}

  const act = textoActividad(l);

    <div class="linea-top">
      <input type="time" value="${l.horaIni}" onchange="setLinea(${l.id}, 'horaIni', this.value)" aria-label="Hora inicio">

      <input type="time" value="${l.horaFin}" onchange="setLinea(${l.id}, 'horaFin', this.value)" aria-label="Hora fin">

      <button class="btn-x" onclick="quitarLinea(${l.id})" aria-label="Quitar actividad">✕</button>
    </div>

// ---------- Cálculo de horas a nivel de DÍA ----------
function aHoras(str) { if (!str) return null; const [h, m] = str.split(":").map(Number); return h + (m || 0) / 60; }
function duracionTxt(ini, fin) {
  const a = aHoras(ini), b0 = aHoras(fin); if (a === null || b0 === null) return "";
  let b = b0; if (b <= a) b += 24; const d = Math.round((b - a) * 100) / 100; return `${d} h`;
}
function cuotaOrdinariaDia(fechaStr) {
  const d = new Date(fechaStr + "T00:00:00").getDay();
  if (d >= 1 && d <= 4) return 8;
  if (d === 5) return 7.5;
  if (d === 6) return semanaTieneFestivo(fechaStr) ? 0 : 5;
  return 0;
}
// intervalos: [{ini, fin, ref}] -> [{ref, tipoHora, horas}]
function clasificarDia(fechaStr, intervalos) {
  const dom = new Date(fechaStr + "T00:00:00").getDay() === 0 || esFestivoColombia(fechaStr);
  let restante = cuotaOrdinariaDia(fechaStr);
  const salida = [];
  const orden = intervalos.map(iv => {
    const a = aHoras(iv.ini); let b = aHoras(iv.fin); if (b <= a) b += 24;
    return { ...iv, a, b };
  }).sort((x, y) => x.a - y.a);
  orden.forEach(iv => {
    const puntos = new Set([iv.a, iv.b]);
    if (restante > 0 && iv.a + restante < iv.b) puntos.add(iv.a + restante);
    for (let k = -1; k <= 2; k++) { [k * 24 + 19, k * 24 + 6].forEach(t => { if (t > iv.a && t < iv.b) puntos.add(t); }); }
    const cortes = [...puntos].sort((x, y) => x - y);
    const tot = {};
    for (let i = 0; i < cortes.length - 1; i++) {
      const dur = cortes[i + 1] - cortes[i]; if (dur <= 1e-9) continue;
      const esOrd = restante > 1e-9;
      const tipo = nombreTipoHora(esOrd, esHoraNocturna((cortes[i] + cortes[i + 1]) / 2), dom);
      tot[tipo] = (tot[tipo] || 0) + dur;
      if (esOrd) restante = Math.max(0, restante - dur);
    }
    Object.entries(tot).forEach(([tipoHora, h]) => { if (h > 0.001) salida.push({ ref: iv.ref, tipoHora, horas: Math.round(h * 100) / 100 }); });
  });
  return salida;
}
function traslapes(intervalos) {
  const o = intervalos.map(iv => { const a = aHoras(iv.ini); let b = aHoras(iv.fin); if (b <= a) b += 24; return [a, b]; }).sort((x, y) => x[0] - y[0]);
  for (let i = 1; i < o.length; i++) if (o[i][0] < o[i - 1][1] - 1e-9) return true;
  return false;
}
function porPersona() {
  const mapa = {};
  jornada.lineas.forEach(l => {
    if (!l.horaIni || !l.horaFin || !(l.codAct || l.np)) return;
    l.personas.forEach(n => { (mapa[n] = mapa[n] || []).push({ ini: l.horaIni, fin: l.horaFin, ref: l.id }); });
  });
  return mapa;
}
function renderResumenDia() {
  const fecha = document.getElementById("fecha").value;
  const mapa = porPersona(); const nombres = Object.keys(mapa);
  if (!nombres.length) return "";
  const filas = nombres.map(n => {
    if (traslapes(mapa[n])) return `<tr class="error"><td>${esc(nombreCorto(n))}</td><td colspan="2">Horarios cruzados: revisa sus actividades</td></tr>`;
    const seg = clasificarDia(fecha, mapa[n]);
    const total = seg.reduce((s, x) => s + x.horas, 0);
    const extra = seg.filter(x => x.tipoHora.includes("Extra")).reduce((s, x) => s + x.horas, 0);
    return `<tr><td>${esc(nombreCorto(n))}</td><td>${Math.round(total * 100) / 100} h</td><td>${extra > 0 ? `<span class="extra">${Math.round(extra * 100) / 100} h extra</span>` : "—"}</td></tr>`;
  }).join("");
  return `
  <div class="card">
    <h2>Resumen del día por persona</h2>
    <table class="resumen"><tr><th>Persona</th><th>Total</th><th>Extra</th></tr>${filas}</table>
    <p class="nota">Las horas extra se calculan con toda la jornada de la persona (Ley 2101).</p>
  </div>`;
}


// ---------- Fecha: Hoy / Ayer y aviso de horario futuro ----------
function fechaLocal(desfaseDias) {
  const d = new Date(); d.setDate(d.getDate() + desfaseDias);
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}
function ponerFecha(desfase) { document.getElementById("fecha").value = fechaLocal(desfase); alCambiarFecha(); }
function alCambiarFecha() {

}
function actualizarFechaTxt() {
  const v = document.getElementById("fecha").value;
  const el = document.getElementById("fechaTxt"); if (!el) return;
  const dias = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
  const meses = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  if (!v) { el.textContent = ""; return; }
  const d = new Date(v + "T12:00:00");
  el.textContent = `Registrando: ${dias[d.getDay()]} ${d.getDate()} de ${meses[d.getMonth()]}`;
  document.getElementById("btnHoy").classList.toggle("activo", v === fechaLocal(0));
  document.getElementById("btnAyer").classList.toggle("activo", v === fechaLocal(-1));
}
function avisoHorarioFuturo() {
  if (document.getElementById("fecha").value !== fechaLocal(0)) return "";
  const ahora = new Date(); const hhmm = String(ahora.getHours()).padStart(2, "0") + ":" + String(ahora.getMinutes()).padStart(2, "0");
  const futura = jornada.lineas.find(l => l.horaFin && l.horaFin > hhmm && (!l.horaIni || l.horaFin > l.horaIni));

    <button type="button" onclick="ponerFecha(-1)">Sí, cambiar a ayer</button></div>`;

// ---------- Evitar duplicados sin preguntar ----------
function claveFila(f) { return [f.fecha, f.nombre, f.codact, f.tipoHora, f.horas, String(f.observaciones || "").slice(0, 11)].join("|"); }
function claveMed(m) { return ["M", m.fecha, m.frenteCod, m.categoriaLetra, m.cantidad].join("|"); }

// ---------- Validación y guardado ----------
function problemasJornada() {
  const p = [];
  if (!jornada.lineas.length) p.push("No hay actividades");
  jornada.lineas.forEach((l, i) => {
    if (!l.horaIni || !l.horaFin) p.push(`Actividad ${i + 1}: falta la hora de inicio o de fin`);
    if (!(l.codAct || l.np)) p.push(`Actividad ${i + 1}: falta elegir la actividad`);
    if (!l.personas.length) p.push(`Actividad ${i + 1}: no tiene personas`);
  });
  const mapa = porPersona();
  Object.entries(mapa).forEach(([n, ivs]) => { if (traslapes(ivs)) p.push(`${nombreCorto(n)} tiene horarios cruzados`); });
  return p;
}
function construirFilasJornada() {
  const fecha = document.getElementById("fecha").value;
  const filas = []; const mapa = porPersona();
  const creado = new Date().toISOString();
  Object.entries(mapa).forEach(([nombre, ivs]) => {
    const persona = jornada.cuadrilla.find(p => p.nombre === nombre) || { cargo: "Sin confirmar" };
    clasificarDia(fecha, ivs).forEach((seg, i) => {
      const l = jornada.lineas.find(x => x.id === seg.ref);
      const frente = CATALOGO.frentes.find(f => f.cod === l.codFrente);
      const a = l.np ? null : CATALOGO.actividades.find(x => x.cod === l.codAct);
      filas.push({
        id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}_${i}`,
        fecha, nombre, cargo: persona.cargo, residente: maestroActual.residente,
        codfrente: l.codFrente, frenteNombre: frente ? frente.nombre : "",
        codcap: a ? a.cod.split(".").slice(0, 2).join(".") : "", codsubcap: a ? a.codSubcap : "",
        codact: l.np ? `NP-${l.codFrente}-${l.np.cat}` : l.codAct,
        actDesc: l.np ? `[NO PRESUPUESTADA] ${l.np.desc}` : (a ? a.desc : ""),
        actUnidad: l.np ? CATEGORIAS[l.np.cat].unidad : (a ? a.unidad : ""),
        horas: seg.horas, tipoHora: seg.tipoHora, cantidad: null,
        observaciones: `${l.horaIni}-${l.horaFin}${persona.cargo === "Sin confirmar" ? " · Persona registrada manualmente, confirmar cargo y cédula" : ""}`,
        creado, registradoPor: maestroActual.nombre, loteId: l.loteId,
      });
    });
  });
  return filas;
}
function construirMediciones() {
  const fecha = document.getElementById("fecha").value;
  return categoriasMediblesHoy().map(({ frente, cat }) => {
    const v = jornada.cantidades[`${frente}|${cat}`] || {};
    const cant = parseFloat(String(v.cantidad || "").replace(",", "."));
    if (!(cant > 0)) return null;
    const f = CATALOGO.frentes.find(x => x.cod === frente);
    const nps = jornada.lineas.filter(l => l.np && l.np.cat === cat && l.codFrente === frente).map(l => l.np.desc);
    return {
      fecha, oficial: v.oficial || `(registró ${maestroActual.nombre})`, frenteCod: frente, frenteNombre: f ? f.nombre : "",
      categoria: CATEGORIAS[cat].nombre, categoriaLetra: cat, unidad: CATEGORIAS[cat].unidad, cantidad: cant,
      observaciones: `Registrado por ${maestroActual.nombre}${nps.length ? " · incluye no presupuestada: " + nps.join("; ") : ""}`,
    };
  }).filter(Boolean);
}

async function guardarJornada() {
  const prob = problemasJornada();
  if (prob.length) { mostrarToast(prob[0]); return; }
  // Lo que ya se envió desde este celular (misma persona, fecha, actividad y horario) se omite solo
  const enviados = new Set(lsGet(claveLS("enviados"), []));
  const todasFilas = construirFilasJornada(), todasMeds = construirMediciones();
  const filas = todasFilas.filter(f => !enviados.has(claveFila(f)));
  const meds = todasMeds.filter(m => !enviados.has(claveMed(m)));
  const omitidas = (todasFilas.length - filas.length) + (todasMeds.length - meds.length);
  if (!filas.length && !meds.length) {
    mostrarToast("Esto ya estaba guardado desde este celular. No se repitió.");
    iniciarJornada(); return;
  }
  const btn = document.getElementById("btnGuardar");
  btn.disabled = true; btn.textContent = "Guardando…";
  try {
    await fetch(URL_APPS_SCRIPT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ registros: filas, hoja: "Registros" }) });
    for (const m of meds) {
      await fetch(URL_APPS_SCRIPT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(m) });
    }
    lsSet(claveLS("cuadrilla"), jornada.cuadrilla);
    lsSet(claveLS("enviados"), [...filas.map(claveFila), ...meds.map(claveMed), ...enviados].slice(0, 4000));
    mostrarToast(`✔ Guardado: ${filas.length} registro(s) de horas${meds.length ? " y " + meds.length + " medición(es)" : ""}` +
      (omitidas ? ` · ${omitidas} ya estaban guardados y no se repitieron` : ""));
    iniciarJornada();
  } catch (e) {
    mostrarToast("No se pudo guardar. Revisa tu conexión e intenta de nuevo.");
  }
  btn.textContent = "Guardar el día";
  actualizarBotonGuardar();
}

function renderResultadoBuscador() {
  const a = CATALOGO.actividades.find(x => x.cod === bus.act); if (!a) return "";
  const cap = CATALOGO.capitulos.find(c => c.cod === bus.cap), sub = CATALOGO.subcapitulos.find(x => x.cod === a.codSubcap);
  return `
    <div class="bus-resultado" id="busResultado">
      <div class="bus-codigos">
        <div><small>CÓDIGO DE FRENTE</small><b>${bus.frente}</b></div>
        <div><small>CÓDIGO DE ACTIVIDAD</small><b>${a.cod}</b></div>
      </div>
      <div class="bus-desc">${esc(a.desc)}</div>
      <div class="bus-ruta">Unidad: <b>${esc(a.unidad)}</b><br>Capítulo: ${esc(cap ? cap.nombre.split("(")[0].trim() : "")}<br>Subcapítulo: ${esc(sub ? sub.nombre.split("(")[0].trim().slice(0, 90) : "")}</div>
      <button class="btn btn-secundario btn-copiar" onclick="copiarCodigo('${a.cod}')">Copiar código ${a.cod}</button>
    </div>`;
}
function copiarCodigo(cod) {
  const ok = () => mostrarToast(`Código ${cod} copiado`);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(cod).then(ok, () => prompt("Copia el código:", cod));
  else prompt("Copia el código:", cod);
}

cargarCatalogo();
