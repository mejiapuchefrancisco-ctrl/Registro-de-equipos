<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Campo · Da Porto</title>
<style>
  :root {
    --verde: #1A5632;
    --verde-oscuro: #0F331D;
    --verde-claro: #4C8A64;
    --dorado: #C9A227;
    --gris-borde: #D8DED9;
    --gris-texto: #3A3F3C;
    --fondo: #F5F7F5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--fondo); color: var(--gris-texto); padding-bottom: 90px;
  }
  header {
    background: var(--verde); color: white; padding: 14px 16px;
    display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 20;
  }
  header img { height: 34px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; }
  header p { margin: 0; font-size: 11px; opacity: .85; }
  main { padding: 14px; max-width: 560px; margin: 0 auto; }
  .card {
    background: white; border: 1px solid var(--gris-borde); border-radius: 10px;
    padding: 14px; margin-bottom: 14px;
  }
  .card h2 {
    font-size: 13px; text-transform: none; color: var(--verde-oscuro);
    margin: 0 0 10px 0; font-weight: 700;
  }
  label { display: block; font-size: 12.5px; color: var(--gris-texto); margin: 10px 0 4px; }
  label:first-child { margin-top: 0; }
  select, input[type=text], input[type=number], input[type=date] {
    width: 100%; padding: 10px 10px; border: 1.5px solid var(--gris-borde);
    border-radius: 8px; font-size: 15px; background: white; color: var(--gris-texto);
  }
  select:focus, input:focus { outline: none; border-color: var(--verde); }
  .fila { display: flex; gap: 8px; }
  .fila > div { flex: 1; }
  .persona-chip {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: #EEF3EF; border: 1px solid var(--gris-borde); border-radius: 8px;
    padding: 8px 10px; margin-top: 8px; flex-wrap: wrap;
  }
  .persona-chip .nombre { font-size: 13.5px; font-weight: 600; flex: 1; min-width: 120px; }
  .persona-chip .cargo { font-size: 11px; color: var(--gris-texto); opacity: .7; }
  .persona-chip input[type=number] { width: 62px; padding: 6px; font-size: 13px; }
  .persona-chip input[type=text] { width: 100px; padding: 6px; font-size: 12px; }
  .persona-chip select { width: auto; padding: 6px; font-size: 12px; }
  .hora-fin-auto {
    display: flex; flex-direction: column; gap: 3px; width: 100%;
    background: #FFFFFF; border: 1px solid var(--gris-borde); border-radius: 6px;
    padding: 8px; margin-top: 4px;
  }
  .hora-fin-auto label { font-size: 10.5px; color: var(--gris-texto); }
  .hora-fin-auto input[type=time] { padding: 6px; font-size: 13px; }
  .fila-horas { display: flex; align-items: center; gap: 6px; }
  .fila-horas input[type=time] { flex: 1; min-width: 0; }
  .fila-horas span { font-size: 11px; color: var(--gris-texto); }
  .resumen-auto {
    font-size: 12px; font-weight: 600; color: var(--verde-oscuro);
    background: #FBF3D9; border-radius: 5px; padding: 4px 7px; margin-top: 2px;
  }
  .resumen-auto.aviso { color: #8a6d00; background: #FFF3CD; font-weight: 500; }
  .manual-toggle {
    width: 100%; font-size: 11.5px; color: var(--gris-texto); margin-top: 2px;
  }
  .manual-toggle summary { cursor: pointer; padding: 4px 0; }
  .manual-toggle input, .manual-toggle select { margin-top: 6px; }
  .btn-x {
    background: none; border: none; color: #B4453A; font-size: 18px; cursor: pointer;
    padding: 0 4px; line-height: 1;
  }
  .buscador-personal { position: relative; margin-top: 10px; }
  .resultados {
    position: absolute; z-index: 10; background: white; border: 1px solid var(--gris-borde);
    border-radius: 8px; width: 100%; max-height: 180px; overflow-y: auto; box-shadow: 0 4px 10px rgba(0,0,0,.08);
  }
  .resultados div { padding: 9px 10px; font-size: 13.5px; cursor: pointer; border-bottom: 1px solid #F0F0F0; }
  .resultados div:hover { background: #EEF3EF; }
  .btn {
    display: inline-block; border: none; border-radius: 8px; padding: 11px 16px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn-primario { background: var(--verde); color: white; width: 100%; }
  .btn-primario:disabled { background: #A9BBAE; }
  .btn-secundario { background: white; color: var(--verde); border: 1.5px solid var(--verde); width: 100%; }
  .btn-agregar-bloque {
    background: #EEF3EF; color: var(--verde-oscuro); border: 1.5px dashed var(--verde-claro);
    width: 100%; padding: 12px; margin-top: 6px;
  }
  .bloque { border-top: 2px solid var(--dorado); padding-top: 12px; margin-top: 16px; position: relative; }
  .bloque:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  .bloque-num { font-size: 11px; color: var(--dorado); font-weight: 700; margin-bottom: 6px; letter-spacing: .3px; }
  .quitar-bloque { position: absolute; right: 0; top: 0; }
  .barra-inferior {
    position: fixed; bottom: 0; left: 0; right: 0; background: white;
    border-top: 1px solid var(--gris-borde); padding: 10px 14px; z-index: 20;
  }
  .aviso {
    background: #FBF3D9; border: 1px solid var(--dorado); border-radius: 8px;
    padding: 10px 12px; font-size: 12.5px; margin-bottom: 14px; color: var(--verde-oscuro);
  }
  .toast {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
    background: var(--verde-oscuro); color: white; padding: 12px 20px; border-radius: 8px;
    font-size: 14px; z-index: 30; display: none; max-width: 90%; text-align: center;
  }
  .vacio { text-align: center; color: #8A948E; font-size: 13px; padding: 20px 0; }
  .campo-libre { font-size: 11px; color: var(--verde); background: none; border: none; cursor: pointer; padding: 4px 0; text-decoration: underline; }

  .interruptor {
    display: flex; background: #EEF3EF; border-radius: 10px; padding: 4px;
    margin-bottom: 14px; gap: 4px;
  }
  .interruptor button {
    flex: 1; border: none; background: none; padding: 10px; border-radius: 8px;
    font-size: 14px; font-weight: 700; color: var(--verde-oscuro); cursor: pointer;
  }
  .interruptor button.activo { background: var(--verde); color: white; }

  .equipo-fila {
    background: #EEF3EF; border: 1px solid var(--gris-borde); border-radius: 8px;
    padding: 10px; margin-top: 8px; position: relative;
  }
  .equipo-fila .quitar-equipo { position: absolute; right: 8px; top: 8px; }
  .equipo-fila .fila { margin-top: 8px; }

  .caja-codigos {
    background: #FBF3D9; border: 1.5px solid var(--dorado); border-radius: 8px;
    padding: 12px; margin-top: 10px; font-size: 15px; color: var(--verde-oscuro);
  }
  .caja-codigos b { color: var(--verde-oscuro); }
  .caja-codigos div { margin-bottom: 4px; }
  .nota-caja-codigos { font-size: 11px; color: var(--gris-texto); margin-top: 6px !important; font-weight: normal; }

  /* ---------- v2: jornada ---------- */
  .contador { background: var(--verde); color: white; border-radius: 10px; padding: 1px 8px; font-size: 11px; margin-left: 4px; }
  .nota-h { font-weight: 400; color: #6B756F; font-size: 11.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 16px; padding: 7px 12px; font-size: 13px;
          border: 1.5px solid var(--gris-borde); background: white; color: var(--gris-texto); cursor: pointer; font-family: inherit; }
  .chip.on { background: #E3EEE6; border-color: var(--verde-claro); color: var(--verde-oscuro); font-weight: 600; }
  .chip.off { background: #F3F4F3; color: #9AA39D; text-decoration: line-through; }
  .chip.rec { background: #FBF3D9; border-color: var(--dorado); color: var(--verde-oscuro); text-align: left; }
  .chip button { background: none; border: none; color: #B4453A; font-size: 14px; cursor: pointer; padding: 0 0 0 2px; }
  .vacio-inline { color: #8A948E; font-size: 13px; }
  .btn-suave { background: #EEF3EF; color: var(--verde-oscuro); border: 1.5px solid var(--verde-claro); width: 100%; margin-top: 8px; }
  .nota { font-size: 11.5px; color: #6B756F; margin: 6px 0 0; }
  .linea { border: 1.5px solid var(--gris-borde); border-left: 4px solid var(--verde); border-radius: 8px; padding: 10px; margin-bottom: 10px; background: white; }
  .linea.incompleta { border-left-color: var(--dorado); }
  .linea-top { display: flex; align-items: center; gap: 6px; }
  .linea-top input[type=time] { width: auto; flex: 1; min-width: 0; padding: 8px 6px; font-size: 15px; border: 1.5px solid var(--gris-borde); border-radius: 8px; }
  .linea-top span { font-size: 12px; }
  .linea-top .dur { font-weight: 700; color: var(--verde-oscuro); min-width: 42px; text-align: right; }
  .act-elegida { margin-top: 8px; cursor: pointer; }
  .act-titulo { font-size: 14px; font-weight: 600; color: var(--verde-oscuro); }
  .act-sub { font-size: 11.5px; color: #6B756F; }
  .tag-np { background: #FBF3D9; color: #7A5E00; border-radius: 6px; padding: 1px 6px; font-size: 10.5px; font-weight: 600; }
  .picker { background: #F7F9F7; border: 1px dashed var(--verde-claro); border-radius: 8px; padding: 10px; margin-top: 8px; }
  .lista-act div { background: white; border: 1px solid var(--gris-borde); border-radius: 8px; padding: 8px 10px; margin-top: 6px; cursor: pointer; }
  .lista-act div:active { background: #E3EEE6; }
  .lista-act b { display: block; font-size: 13px; color: var(--verde-oscuro); }
  .lista-act span { font-size: 11px; color: #6B756F; }
  details.np { margin-top: 10px; font-size: 13px; }
  details.np summary { cursor: pointer; color: #7A5E00; font-weight: 600; padding: 4px 0; }
  .chips-linea { margin-top: 10px; }
  .chips-linea .chip { padding: 5px 10px; font-size: 12px; }
  .cant-fila { border-top: 1px solid #EEF1EE; padding: 8px 0; }
  .cant-fila:first-of-type { border-top: none; }
  .cant-nombre { font-size: 13.5px; font-weight: 600; color: var(--verde-oscuro); margin-bottom: 6px; }
  .cant-inputs { display: flex; gap: 6px; align-items: center; }
  .cant-inputs input { width: 90px !important; flex: none; }
  .cant-inputs .unidad { font-size: 13px; font-weight: 600; min-width: 24px; }
  .cant-inputs select { flex: 1; min-width: 0; font-size: 13px; padding: 9px 6px; }
  table.resumen { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.resumen th { text-align: left; font-size: 11.5px; color: #6B756F; font-weight: 600; padding: 4px 0; border-bottom: 1px solid var(--gris-borde); }
  table.resumen td { padding: 6px 0; border-bottom: 1px solid #F0F2F0; }
  table.resumen tr.error td { color: #B4453A; font-weight: 600; }
  .extra { color: #7A5E00; font-weight: 600; }
  button:disabled { opacity: .55; }
  .fecha-rapida { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .fecha-rapida button { border: 1.5px solid var(--verde-claro); background: white; color: var(--verde-oscuro);
    border-radius: 18px; padding: 7px 16px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .fecha-rapida button.activo { background: var(--verde); color: white; border-color: var(--verde); }
  #fechaTxt { font-size: 13.5px; font-weight: 700; color: var(--verde-oscuro); }
  .aviso-fecha { background: #FFF3CD; border: 1.5px solid var(--dorado); border-radius: 8px; padding: 10px 12px;
    font-size: 13px; color: #5C4600; margin-bottom: 10px; }
  .aviso-fecha button { margin-top: 8px; width: 100%; background: var(--dorado); color: #1E2A22; border: none;
    border-radius: 8px; padding: 10px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .interruptor button { font-size: 13.5px; }
  .bus-resultado { background: #FBF3D9; border: 1.5px solid var(--dorado); border-radius: 10px; padding: 14px; margin-top: 12px; }
  .bus-codigos { display: flex; gap: 10px; }
  .bus-codigos > div { flex: 1; background: white; border-radius: 8px; padding: 10px; text-align: center; }
  .bus-codigos small { display: block; font-size: 10.5px; color: #6B756F; font-weight: 600; letter-spacing: .3px; }
  .bus-codigos b { display: block; font-size: 22px; color: var(--verde-oscuro); margin-top: 2px; }
  .bus-desc { font-size: 13px; color: var(--verde-oscuro); margin-top: 10px; line-height: 1.4; }
  .bus-ruta { font-size: 11.5px; color: #6B756F; margin-top: 8px; line-height: 1.4; }
  .btn-copiar { margin-top: 10px; }
  /* ---------- v3: supervisión del maestro y control de horas ---------- */
  .linea-top .dur.mal { color: #B4453A; }
  .alerta-hora { background: #FDEBEA; border: 1.5px solid #B4453A; border-radius: 8px; padding: 8px 10px; font-size: 12.5px; color: #7A2A22; margin-top: 8px; }
  .alerta-hora label { display: flex; align-items: center; gap: 6px; margin: 6px 0 0; font-weight: 600; color: #1E2A22; }
  .card-sup { border: 2px solid var(--verde-claro); }
  .sup-toggle { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; color: var(--verde-oscuro); margin: 0; }
  .sup-toggle input { width: 22px; height: 22px; }
  .sup-horas { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  .sup-horas input[type=time] { flex: 1; min-width: 0; padding: 8px 6px; font-size: 15px; border: 1.5px solid var(--gris-borde); border-radius: 8px; }
  .sup-total { background: #E3EEE6; border-radius: 8px; padding: 8px 10px; margin-top: 10px; font-size: 13.5px; color: var(--verde-oscuro); }
  .sup-total b { font-size: 16px; }
  .sup-aviso { background: #FFF3CD; border: 1.5px solid var(--dorado); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; color: #5C4600; margin-top: 8px; }
  .sup-error { background: #FDEBEA; border: 1.5px solid #B4453A; border-radius: 8px; padding: 8px 10px; font-size: 12.5px; color: #7A2A22; margin-top: 8px; }
  .sup-aviso input { margin-top: 6px; }
  .chip.frente { border-radius: 8px; text-align: left; line-height: 1.25; }
  .chip.frente small { display: block; font-size: 10.5px; font-weight: 400; opacity: .8; }
  .chip.frente.off { text-decoration: none; background: white; color: #6B756F; border-style: dashed; }
  .agregar-frente { margin-top: 8px; font-size: 13px; padding: 8px; }
  /* ---------- v4: control contra el Sheet ---------- */
  .card-pend { border: 2px solid var(--dorado); }
  .card-pend.ok { border-color: var(--verde-claro); color: var(--verde-oscuro); font-size: 13.5px; font-weight: 600; }
  .pend-fila { padding: 6px 0; border-bottom: 1px solid #F0F2F0; }
  .pend-nombre { font-size: 13.5px; font-weight: 700; color: var(--verde-oscuro); margin-bottom: 4px; }
  .chip.pend { background: #FFF3CD; border-color: var(--dorado); color: #5C4600; font-weight: 600; }
  .chip.pend.on { background: var(--dorado); color: #1E2A22; }
  .chip.ocultar { background: white; color: #6B756F; font-size: 11px; border-style: dashed; }
  .chip small.ya { display: block; font-size: 10px; font-weight: 600; color: #7A5E00; }
  .chip.nov { background: #F3F4F3; color: #6B756F; border-style: dashed; }
  .chip em { font-style: normal; font-size: 10.5px; font-weight: 700; color: #7A5E00; }
  .chip button.nov-btn { color: var(--verde-oscuro); font-weight: 700; font-size: 15px; }
  .nov-editor { background: #F6F8F6; border: 1.5px solid var(--gris-borde); border-radius: 8px; padding: 10px; margin-top: 10px; font-size: 13px; }
  .nov-editor input[type=text] { margin-top: 8px; }
  .fila-botones { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .fila-botones .btn { width: auto; flex: 1; }
  .sug-np { background: #FFF3CD; border: 1.5px solid var(--dorado); border-radius: 8px; padding: 8px 10px; margin-top: 8px; font-size: 12.5px; color: #5C4600; }
  .sug-item { background: white; border: 1px solid var(--gris-borde); border-radius: 8px; padding: 7px 9px; margin-top: 6px; cursor: pointer; color: var(--gris-texto); }
  .sug-item span, .lista-act .otro-frente span { display: block; font-size: 11px; color: #6B756F; }
  .lista-act .otro-frente { border-style: dashed; }
  .just-label { display: block; margin-top: 8px; font-weight: 700; color: #1E2A22; }
  .card-cierre { border: 2px solid var(--verde-claro); }
  .card-cierre.bloquea { border-color: #B4453A; background: #FFF8F7; }
  .cierre-fila { padding: 8px 0; border-bottom: 1px solid #F0F2F0; }
  .version-app { text-align: center; font-size: 11px; color: #9AA39D; margin-top: 10px; }
  /* ---------- v5: inicio, pasos, horas con botones, novedades, mi semana ---------- */
  .chip { min-height: 40px; }
  .chip.hora { font-weight: 700; }
  .chip.hora.on { background: var(--verde); border-color: var(--verde); color: white; }
  .chip.otra { position: relative; gap: 6px; }
  .chip.otra input[type=time] { width: 112px; padding: 4px 6px; font-size: 14px; border: 1px solid var(--gris-borde); border-radius: 6px; }
  .hoy-top { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .anillo { width: 64px; height: 64px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
    background: conic-gradient(var(--verde) calc(var(--p) * 1%), #E3E9E4 0); }
  .anillo span { width: 50px; height: 50px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px; color: var(--verde-oscuro); }
  .hoy-top b { display: block; font-size: 17px; color: var(--verde-oscuro); }
  .hoy-top small { font-size: 13px; color: #5B6760; }
  .btn-grande { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; text-align: left; border: none; border-radius: 10px;
    background: var(--verde); color: white; padding: 12px 14px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; margin-bottom: 8px; }
  .btn-grande small { font-size: 12.5px; font-weight: 400; opacity: .92; }
  .banner-cola { background: #FFF3CD; border: 1.5px solid var(--dorado); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: #5C4600; margin-bottom: 14px; }
  .tira { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center; }
  .tira button { border: 1.5px solid transparent; border-radius: 8px; background: #EEF1EE; min-height: 46px; font-family: inherit; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: #5B6760; padding: 2px; }
  .tira button b { font-size: 12.5px; color: var(--gris-texto); }
  .tira .completo { background: #DCEBE0; } .tira .completo b { color: var(--verde-oscuro); }
  .tira .parcial { background: #FFF3CD; border-color: var(--dorado); } .tira .parcial b { color: #5C4600; }
  .tira .sel { border-color: var(--verde); border-width: 2px; }
  .paso-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .paso-top button { width: 44px; height: 44px; border: none; background: white; border-radius: 22px; font-size: 22px; color: var(--verde-oscuro); cursor: pointer; flex: none; }
  .paso-top b { display: block; font-size: 17px; color: var(--verde-oscuro); }
  .paso-top span { font-size: 12.5px; color: #5B6760; }
  .barra-pasos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 14px; }
  .barra-pasos i { height: 5px; border-radius: 3px; background: var(--gris-borde); }
  .barra-pasos i.on { background: var(--verde); }
  .fila-p { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #F0F2F0; }
  .fila-p label { display: flex; align-items: center; gap: 10px; flex: 1; margin: 0; cursor: pointer; min-height: 40px; }
  .fila-p input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--verde); flex: none; }
  .fila-p b { display: block; font-size: 14.5px; color: var(--gris-texto); }
  .fila-p small { display: block; font-size: 12px; color: #6B756F; }
  .fila-p.con-nov b { color: #6B756F; }
  .fila-p .tag-nov { color: #7A5E00; font-weight: 700; }
  .btn-nov { border: 1.5px solid var(--gris-borde); background: white; border-radius: 8px; padding: 0 10px; min-height: 40px; font-size: 13px; font-weight: 600;
    color: var(--verde-oscuro); cursor: pointer; font-family: inherit; }
  .grupo-nov { font-size: 11px; font-weight: 700; color: #6B756F; letter-spacing: .3px; margin: 10px 0 2px; text-transform: uppercase; }
  .nov-res { background: #E3EEE6; border-radius: 8px; padding: 8px 10px; margin-top: 10px; font-size: 13px; color: var(--verde-oscuro); }
  .nov-res.no { background: #F3F4F3; color: #5B6760; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: #E3E9E4; border-radius: 10px; padding: 4px; margin-top: 8px; }
  .seg button { border: none; border-radius: 8px; min-height: 40px; background: transparent; font-weight: 700; font-family: inherit; cursor: pointer; color: var(--gris-texto); }
  .seg button.on { background: var(--verde); color: white; }
  .tl { position: relative; height: 14px; background: #F1F3F1; border-radius: 4px; margin-top: 4px; }
  .tl span { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
  .tl .ord { background: var(--verde); } .tl .ext { background: #E0A526; } .tl .dom { background: #3D6E8C; }
  .tl .ya { background: repeating-linear-gradient(45deg, #C9D3CC 0 4px, #E3E9E4 4px 8px); }
  .tl .nov { background: #8A5A9E; }
  .tl-escala { position: relative; height: 14px; font-size: 10.5px; color: #6B756F; }
  .tl-escala span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .rev-fila { padding: 8px 0; border-bottom: 1px solid #F0F2F0; }
  .rev-fila .cab { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
  .rev-fila .cab b { color: var(--gris-texto); }
  .leyenda { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; color: #6B756F; margin-top: 8px; }
  .leyenda i { display: inline-block; width: 12px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  .problemas { background: #FDEBEA; border: 1.5px solid #B4453A; border-radius: 8px; padding: 8px 12px; font-size: 13px; color: #7A2A22; margin-bottom: 14px; }
  .problemas li { margin: 3px 0; }
  .sem-grid { display: grid; grid-template-columns: 78px repeat(7, minmax(0, 1fr)) 30px 36px; gap: 3px; align-items: center; font-size: 12px; }
  .sem-grid .h { font-weight: 700; color: #6B756F; text-align: center; font-size: 11px; }
  .sem-grid .n { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sem-grid .c { height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; background: #F1F3F1; color: #9AA39D; }
  .sem-grid .c.t { background: #DCEBE0; color: var(--verde-oscuro); }
  .sem-grid .c.alto { background: #FFE3B0; color: #5C3F00; }
  .sem-grid .c.dom { background: #DCE6F2; color: #1F3B5C; }
  .sem-grid .c.nv { background: #EFE7F3; color: #5B3770; font-size: 10.5px; }
  .sem-grid .tot { text-align: right; font-weight: 700; }
  .sem-grid .ex { text-align: center; font-weight: 700; color: #5C3F00; border-radius: 6px; padding: 5px 0; }
  .sem-grid .ex.mal { background: #B3261E; color: white; }
  .nov-sem { padding: 8px 0; border-bottom: 1px solid #F0F2F0; font-size: 13px; }
  .nov-sem b { color: var(--gris-texto); }
  .pill { display: inline-block; border-radius: 6px; padding: 1px 7px; font-size: 11.5px; font-weight: 700; margin: 3px 4px 0 0; }
  .pill.paga { background: var(--verde); color: white; } .pill.nopaga { background: #FDEBEA; color: #7A2A22; }
  .pill.gris { background: #E3E9E4; color: #3A4740; } .pill.pend { background: #FFE3B0; color: #5C3F00; }
</style>
</head>
<body>

<header>
  <img src="../mano-obra/aia.png" alt="AIA" onerror="this.style.display='none'">
  <div>
    <h1 id="tituloApp">Registro de Campo</h1>
    <p>Da Porto · Diligenciamiento diario</p>
  </div>
</header>

<div class="toast" id="toast"></div>

<main>

  <div class="interruptor">
    <button id="btnModoPersonal" class="activo" onclick="cambiarModo('personal')">Registro</button>
    <button id="btnModoSemana" onclick="cambiarModo('semana')">Mi semana</button>
    <button id="btnModoBuscador" onclick="cambiarModo('buscador')">Buscar códigos</button>
    <button id="btnModoEquipos" onclick="cambiarModo('equipos')" style="display:none">🚜 Equipos</button>
    <button id="btnModoMateriales" onclick="cambiarModo('materiales')" style="display:none">📦 Materiales</button>
  </div>

  <div class="card" id="cardQuien">
    <h2 id="tituloPaso1">1. ¿Quién eres?</h2>
    <label for="selMaestro" id="labelPaso1">Busca tu nombre</label>
    <select id="selMaestro" onchange="onMaestroChange()">
      <option value="">— Selecciona tu nombre —</option>
    </select>

    <label for="fecha">Fecha</label>
    <input type="date" id="fecha" onchange="alCambiarFecha()">
    <div class="fecha-rapida">
      <button type="button" id="btnHoy" onclick="ponerFecha(0)">Hoy</button>
      <button type="button" id="btnAyer" onclick="ponerFecha(-1)">Ayer</button>
      <span id="fechaTxt"></span>
    </div>
  </div>

  <div id="zonaJornada"></div>
  <div id="zonaSemana" style="display:none"></div>
  <div id="zonaBuscador" style="display:none"></div>
  <div id="zonaBloques" style="display:none"></div>

  <button class="btn btn-agregar-bloque" id="btnAgregarBloque" onclick="agregarBloque()" disabled style="display:none">
    + Agregar otro bloque de actividad
  </button>

  <p class="version-app">Da Porto piloto v1 · 27-nov-2026 (base AIRPLAN v6 / Milán)</p>
  <div style="height: 90px"></div>
</main>

<div class="barra-inferior" id="barraGuardar">
  <button class="btn btn-primario" id="btnGuardar" onclick="guardarTodo()" disabled>
    Guardar el día
  </button>
</div>

<script>
// =================== CONFIGURACIÓN ===================
// Reemplaza esta URL por la de tu Google Apps Script publicado (ver instrucciones).
// Pulso de Obra – Da Porto (piloto). Al implementar el Apps Script pegue aquí su URL; al migrar a Costos, cambiar SOLO esta URL y SHEET_ID.
const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbx29X4qQsN5_aUes5YqivAdiESXmP-biXBSXe3SPTa8MHOJHQpKQehCGq0hR_JAFwnC/exec";
// =======================================================

const PROVEEDORES_SUGERIDOS = ["ALDECCO", "MAS EQUIPOS", "EQUIPOS INMEDIATOS"];
const UNIDADES_SUGERIDAS = ["Und", "m2", "m3", "Día", "Hora", "Global"];

let CATALOGO = null;
let maestroActual = null;
let bloques = [];
let contadorBloque = 0;
let modo = "personal"; // "personal" | "equipos"

async function cargarCatalogo() {
  // Da Porto: el catálogo (personal, maestros, actividades) lo entrega el Apps Script desde la hoja que administra Costos.
  // Si no hay señal, usa la última copia guardada en el celular.
  try {
    const resp = await fetch(URL_APPS_SCRIPT + "?accion=catalogo", { cache: "no-store" });
    const c = await resp.json();
    if (!c || !c.ok) throw new Error((c && c.error) || "catálogo vacío");
    CATALOGO = c;
    try { localStorage.setItem("daporto_catalogo", JSON.stringify(c)); } catch (e) {}
  } catch (e) {
    let guardado = null;
    try { guardado = JSON.parse(localStorage.getItem("daporto_catalogo") || "null"); } catch (e2) {}
    if (!guardado) { alert("No se pudo cargar la lista de personal y actividades. Revisa la conexión y vuelve a abrir la app."); return; }
    CATALOGO = guardado;
    setTimeout(() => mostrarToast("Sin conexión: se usa la última lista guardada"), 500);
  }
  if (CATALOGO.parametros && Array.isArray(CATALOGO.parametros.festivos)) {
    CATALOGO.parametros.festivos.forEach(f => { const d = String(f).slice(0, 10); if (!FESTIVOS_COLOMBIA_2026.includes(d)) FESTIVOS_COLOMBIA_2026.push(d); });
  }
  poblarMaestros();
  const hoy = new Date(); hoy.setMinutes(hoy.getMinutes() - hoy.getTimezoneOffset());
  document.getElementById("fecha").value = hoy.toISOString().slice(0, 10);
  actualizarFechaTxt();
  renderJornada();
}

function cambiarModo(nuevoModo) {
  if (nuevoModo === modo) return;
  modo = nuevoModo;
  document.getElementById("btnModoPersonal").classList.toggle("activo", modo === "personal");
  document.getElementById("btnModoEquipos").classList.toggle("activo", modo === "equipos");
  document.getElementById("btnModoMateriales").classList.toggle("activo", modo === "materiales");
  document.getElementById("btnModoBuscador").classList.toggle("activo", modo === "buscador");
  document.getElementById("btnModoSemana").classList.toggle("activo", modo === "semana");
  const titulos = { buscador: "Buscador de códigos", personal: "Registro de campo", semana: "Mi semana", equipos: "Registro de Equipos", materiales: "Pedido de Materiales" };
  document.getElementById("zonaSemana").style.display = modo === "semana" ? "" : "none";
  if (modo === "semana") {
    document.getElementById("tituloApp").textContent = titulos.semana;
    ["zonaJornada", "zonaBuscador", "zonaBloques", "btnAgregarBloque", "barraGuardar"].forEach(id => { document.getElementById(id).style.display = "none"; });
    document.getElementById("cardQuien").style.display = "";
    renderSemana();
    return;
  }
  const paso1 = { buscador: "", personal: "1. ¿Quién eres?", equipos: "1. ¿Quién solicita el equipo?", materiales: "1. ¿Quién solicita el material?" };
  const btnTexto = { buscador: "", personal: "+ Agregar otro bloque de actividad", equipos: "+ Agregar otro bloque de equipos", materiales: "+ Agregar otro bloque de materiales" };
  document.getElementById("tituloApp").textContent = titulos[modo];
  document.getElementById("tituloPaso1").textContent = paso1[modo];
  document.getElementById("labelPaso1").textContent = "Busca tu nombre";
  document.getElementById("btnAgregarBloque").textContent = btnTexto[modo];
  // Al cambiar de modo reiniciamos los bloques para no mezclar datos
  bloques = [];
  contadorBloque = 0;
  const esJornada = modo === "personal", esBuscador = modo === "buscador";
  document.getElementById("zonaJornada").style.display = esJornada ? "" : "none";
  document.getElementById("zonaBuscador").style.display = esBuscador ? "" : "none";
  document.getElementById("zonaBloques").style.display = (esJornada || esBuscador) ? "none" : "";
  document.getElementById("btnAgregarBloque").style.display = (esJornada || esBuscador) ? "none" : "";
  document.getElementById("cardQuien").style.display = esBuscador ? "none" : "";
  document.getElementById("barraGuardar").style.display = esBuscador ? "none" : "";
  if (esBuscador) { renderBuscador(); }
  else if (esJornada) { renderJornada(); } else { if (maestroActual) agregarBloque(); renderBloques(); }
  actualizarBotonGuardar();
}

function poblarMaestros() {
  const sel = document.getElementById("selMaestro");
  const hayMarca = CATALOGO.personal.some(p => p.esMaestro);
  const maestros = CATALOGO.personal
    .filter(p => hayMarca ? p.esMaestro : (p.cargo || "").toLowerCase().includes("maestro"))
    .sort((a, b) => a.nombre.localeCompare(b.nombre));
  maestros.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p.nombre;
    opt.textContent = `${p.nombre} (${p.cargo})`;
    sel.appendChild(opt);
  });
}

function onMaestroChange() {
  const nombre = document.getElementById("selMaestro").value;
  maestroActual = CATALOGO.personal.find(p => p.nombre === nombre) || null;
  document.getElementById("btnAgregarBloque").disabled = !maestroActual;
  actualizarBotonGuardar();
  if (modo === "personal" || modo === "semana") { iniciarJornada(); if (maestroActual) cargarSheet(); if (modo === "semana") renderSemana(); return; }
  if (maestroActual && bloques.length === 0) agregarBloque();
}

function frentesDelMaestro() {
  if (!maestroActual) return [];
  const propios = CATALOGO.residenteFrente.filter(rf => rf.residenteKey === maestroActual.residenteKey);
  const codsPropios = new Set(propios.map(p => p.codFrente));
  const listaPropia = CATALOGO.frentes.filter(f => codsPropios.has(f.cod));
  return listaPropia;
}

function unidadActividad(b) {
  const a = CATALOGO.actividades.find(x => x.cod === b.codActividad);
  return a ? a.unidad : "";
}

function actualizarCantidadBloque(idBloque, valor) {
  const b = bloques.find(x => x.id === idBloque);
  b.cantidadEjecutada = valor;
}

function agregarBloque() {
  contadorBloque++;
  bloques.push({
    id: contadorBloque, codFrente: "", codCapitulo: "", codSubcap: "", codActividad: "",
    personas: [], equipos: [], materiales: [], cantidadEjecutada: "",
    loteId: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
  });
  renderBloques();
}

function quitarBloque(id) {
  bloques = bloques.filter(b => b.id !== id);
  renderBloques();
}

function renderBloques() {
  const zona = document.getElementById("zonaBloques");
  zona.innerHTML = "";
  bloques.forEach((b, idx) => {
    const div = document.createElement("div");
    div.className = "card bloque";
    div.innerHTML = `
      ${bloques.length > 1 ? `<button class="btn-x quitar-bloque" onclick="quitarBloque(${b.id})">✕</button>` : ""}
      <div class="bloque-num">BLOQUE ${idx + 1}</div>

      <label>Frente de trabajo</label>
      <select onchange="cambiarFrente(${b.id}, this.value)">
        <option value="">— Selecciona el frente —</option>
        ${frenteOpciones(b)}
      </select>

      ${b.codFrente ? `
      <label>Capítulo</label>
      <select onchange="cambiarCapitulo(${b.id}, this.value)">
        <option value="">— Selecciona el capítulo —</option>
        ${capituloOpciones(b)}
      </select>` : ""}

      ${b.codCapitulo ? `
      <label>Subcapítulo</label>
      <select onchange="cambiarSubcap(${b.id}, this.value)">
        <option value="">— Selecciona el subcapítulo —</option>
        ${subcapOpciones(b)}
      </select>` : ""}

      ${b.codSubcap ? `
      <label>Actividad</label>
      <select onchange="cambiarActividad(${b.id}, this.value)">
        <option value="">— Selecciona la actividad —</option>
        ${actividadOpciones(b)}
      </select>` : ""}

      ${b.codActividad && modo === "personal" ? `
      <label>Cantidad ejecutada hoy en esta actividad ${unidadActividad(b) ? '(' + unidadActividad(b) + ')' : ''}</label>
      <input type="number" min="0" step="0.01" value="${b.cantidadEjecutada || ''}"
             placeholder="Ej. 2.5" oninput="actualizarCantidadBloque(${b.id}, this.value)">

      <label style="margin-top:14px;">Personal en esta actividad</label>
      <div id="personas-${b.id}"></div>
      <div class="buscador-personal">
        <input type="text" placeholder="Buscar y agregar a alguien de tu cuadrilla u otra persona…"
               oninput="buscarPersona(${b.id}, this.value)" id="buscador-${b.id}">
        <div class="resultados" id="resultados-${b.id}" style="display:none"></div>
      </div>
      <button class="campo-libre" onclick="agregarPersonaLibre(${b.id})">
        ¿No aparece? Escribir el nombre manualmente
      </button>` : ""}

      ${b.codActividad && modo === "equipos" ? `
      <label>Equipos usados en esta actividad</label>
      <div id="equipos-${b.id}"></div>
      <button class="campo-libre" onclick="agregarEquipo(${b.id})" style="margin-top:8px;">
        + Agregar un equipo a este bloque
      </button>` : ""}

      ${b.codActividad && modo === "materiales" ? `
      <div class="caja-codigos">
        <div><b>Código de Frente:</b> ${b.codFrente}</div>
        <div><b>Código de Actividad:</b> ${b.codActividad}</div>
        <div class="nota-caja-codigos">Copia estos códigos en tu remisión / solicitud física.</div>
      </div>
      <label>Materiales pedidos en esta actividad</label>
      <div id="materiales-${b.id}"></div>
      <button class="campo-libre" onclick="agregarMaterial(${b.id})" style="margin-top:8px;">
        + Agregar un material a este bloque
      </button>` : ""}
    `;
    zona.appendChild(div);
    if (b.codActividad && modo === "personal") renderPersonas(b);
    if (b.codActividad && modo === "equipos") renderEquipos(b);
    if (b.codActividad && modo === "materiales") renderMateriales(b);
  });
  actualizarBotonGuardar();
}

function frenteOpciones(b) {
  const propios = frentesDelMaestro();
  const codsPropios = new Set(propios.map(f => f.cod));
  let html = "";
  if (propios.length) {
    html += `<optgroup label="Tus frentes habituales">`;
    propios.forEach(f => {
      html += `<option value="${f.cod}" ${b.codFrente === f.cod ? "selected" : ""}>${f.nombre}</option>`;
    });
    html += `</optgroup><optgroup label="Otros frentes">`;
  }
  CATALOGO.frentes.filter(f => !codsPropios.has(f.cod)).forEach(f => {
    html += `<option value="${f.cod}" ${b.codFrente === f.cod ? "selected" : ""}>${f.nombre}</option>`;
  });
  if (propios.length) html += `</optgroup>`;
  return html;
}

function capituloOpciones(b) {
  return CATALOGO.capitulos.filter(c => c.codFrente === b.codFrente)
    .map(c => `<option value="${c.cod}" ${b.codCapitulo === c.cod ? "selected" : ""}>${c.nombre}</option>`).join("");
}
function subcapOpciones(b) {
  return CATALOGO.subcapitulos.filter(s => s.codCapitulo === b.codCapitulo)
    .map(s => `<option value="${s.cod}" ${b.codSubcap === s.cod ? "selected" : ""}>${s.nombre}</option>`).join("");
}
function actividadOpciones(b) {
  return CATALOGO.actividades.filter(a => a.codSubcap === b.codSubcap)
    .map(a => `<option value="${a.cod}" ${b.codActividad === a.cod ? "selected" : ""}>${a.desc.slice(0, 90)}</option>`).join("");
}

function cambiarFrente(id, val) {
  const b = bloques.find(x => x.id === id);
  b.codFrente = val; b.codCapitulo = ""; b.codSubcap = ""; b.codActividad = "";
  renderBloques();
}
function cambiarCapitulo(id, val) {
  const b = bloques.find(x => x.id === id);
  b.codCapitulo = val; b.codSubcap = ""; b.codActividad = "";
  renderBloques();
}
function cambiarSubcap(id, val) {
  const b = bloques.find(x => x.id === id);
  b.codSubcap = val; b.codActividad = "";
  renderBloques();
}
function cambiarActividad(id, val) {
  const b = bloques.find(x => x.id === id);
  b.codActividad = val;
  renderBloques();
}

// ============ PERSONAL (Mano de Obra) ============
function buscarPersona(idBloque, texto) {
  const cont = document.getElementById(`resultados-${idBloque}`);
  if (!texto || texto.length < 2) { cont.style.display = "none"; return; }
  const t = texto.toLowerCase();
  const encontrados = CATALOGO.personal.filter(p => p.nombre.toLowerCase().includes(t)).slice(0, 8);
  if (!encontrados.length) { cont.style.display = "none"; return; }
  cont.innerHTML = encontrados.map(p =>
    `<div onclick='agregarPersona(${idBloque}, ${JSON.stringify(p.nombre)}, ${JSON.stringify(p.cargo)})'>${p.nombre} <span style="color:#999">(${p.cargo})</span></div>`
  ).join("");
  cont.style.display = "block";
}

function agregarPersona(idBloque, nombre, cargo) {
  const b = bloques.find(x => x.id === idBloque);
  if (b.personas.some(p => p.nombre === nombre)) return;
  b.personas.push({ nombre, cargo, horas: 8, tipoHora: "Ordinaria Diurna", cantidad: "", horaIni: "", horaFin: "" });
  document.getElementById(`buscador-${idBloque}`).value = "";
  document.getElementById(`resultados-${idBloque}`).style.display = "none";
  renderPersonas(b);
  actualizarBotonGuardar();
}

function agregarPersonaLibre(idBloque) {
  const nombre = prompt("Escribe el nombre completo de la persona:");
  if (!nombre) return;
  const b = bloques.find(x => x.id === idBloque);
  b.personas.push({ nombre: nombre.trim(), cargo: "Sin confirmar", horas: 8, tipoHora: "Ordinaria Diurna", cantidad: "", horaIni: "", horaFin: "" });
  renderPersonas(b);
  actualizarBotonGuardar();
}

function quitarPersona(idBloque, nombre) {
  const b = bloques.find(x => x.id === idBloque);
  b.personas = b.personas.filter(p => p.nombre !== nombre);
  renderPersonas(b);
  actualizarBotonGuardar();
}

function renderPersonas(b) {
  const cont = document.getElementById(`personas-${b.id}`);
  if (!cont) return;
  if (!b.personas.length) {
    cont.innerHTML = `<div class="vacio">Aún no has agregado a nadie en este bloque</div>`;
    return;
  }
  const tiposHora = CATALOGO.recargos.map(r => r.tipo);
  const fechaGlobal = document.getElementById("fecha").value;
  cont.innerHTML = b.personas.map(p => {
    const segmentos = calcularSegmentosHora(fechaGlobal, p.horaIni, p.horaFin);
    const resumenAuto = segmentos
      ? `<div class="resumen-auto">${segmentos.map(s => `${s.horas}h ${s.tipoHora}`).join(" + ")}</div>`
      : "";
    return `
    <div class="persona-chip">
      <div>
        <div class="nombre">${p.nombre}</div>
        <div class="cargo">${p.cargo}</div>
      </div>
      <div class="hora-fin-auto">
        <label>Hora de inicio y de finalización (calcula solo el tipo de hora)</label>
        <div class="fila-horas">
          <input type="time" value="${p.horaIni || ""}" placeholder="Inicio"
                 onchange="actualizarPersona(${b.id}, '${p.nombre.replace(/'/g, "\\'")}', 'horaIni', this.value)">
          <span>a</span>
          <input type="time" value="${p.horaFin || ""}" placeholder="Fin"
                 onchange="actualizarPersona(${b.id}, '${p.nombre.replace(/'/g, "\\'")}', 'horaFin', this.value)">
        </div>
        ${resumenAuto}
      </div>
      <details class="manual-toggle">
        <summary>Ingresar horas manualmente</summary>
        <input type="number" min="0" max="24" step="0.5" value="${p.horas}"

// ============ CÁLCULO AUTOMÁTICO DE HORAS (hora inicio + hora fin) ============
// Cuota de horas ORDINARIAS según el día de la semana (a partir de la hora
// en que la persona inició su turno — no se asume que todos entran a las 7am,
// para poder registrar bien los turnos nocturnos):
//   Lunes a Jueves: 8h ordinarias (ej. 7am-3pm), luego extra
//   Viernes:        7.5h ordinarias (ej. 7am-2:30pm), luego extra
//   Sábado:         5h ordinarias (ej. 7am-12m), luego extra —
//                   salvo que esa semana tenga un festivo, en cuyo caso
//                   el sábado completo es extra (0h ordinarias).
//   Domingo:        0h ordinarias — TODO lo trabajado es extra.
//
// Recargo nocturno: 19:00 a 06:00 (Ley 2466 de 2025, vigente desde dic-2025)
// Domingo Y festivos: usa las tarifas "Dominical/Festivo ..." automáticamente.
const FESTIVOS_COLOMBIA_2026 = [
  "2026-01-01", "2026-01-12", "2026-03-23", "2026-04-02", "2026-04-03",
  "2026-05-01", "2026-05-18", "2026-06-08", "2026-06-15", "2026-06-29",
  "2026-07-20", "2026-08-07", "2026-08-17", "2026-10-12", "2026-11-02",
  "2026-11-16", "2026-12-08", "2026-12-25",
  // 2027 (verificar con el calendario oficial; Costos puede agregar más en la pestaña Parametros)
  "2027-01-01", "2027-01-11", "2027-03-22", "2027-03-25", "2027-03-26", "2027-05-01", "2027-05-10",
  "2027-05-31", "2027-06-07", "2027-07-05", "2027-07-20", "2027-08-07", "2027-08-16", "2027-10-18",
  "2027-11-01", "2027-11-15", "2027-12-08", "2027-12-25",
];

// Jornada de Da Porto (Notas Da Porto + tabla ORD T1 de las planillas de novedades): L–J 7:00–16:00 = 7,5 ord + 1 extra;
// V 7:00–15:30 = 7 ord + 1 extra; S 7:00–12:30 = 5 ord. Almuerzo 12:00–12:30 de lunes a sábado (no se cuenta). 42 h ordinarias/semana.
const DP_JORNADA = { lj: 7.5, v: 7, s: 5, almIni: 12, almFin: 12.5 };

function esFestivoColombia(fechaStr) {
  return FESTIVOS_COLOMBIA_2026.includes(fechaStr);
}

function semanaTieneFestivo(fechaStr) {
  // ¿Algún día de lunes a sábado de la semana de 'fechaStr' es festivo?
  // (para decidir si el sábado de esa semana cuenta como todo extra o no)
  const fecha = new Date(fechaStr + "T00:00:00");
  const diasDesdeElLunes = (fecha.getDay() + 6) % 7; // lunes=0 ... domingo=6
  const lunes = new Date(fecha);
  lunes.setDate(fecha.getDate() - diasDesdeElLunes);
  for (let i = 0; i < 6; i++) { // lunes(0) a sábado(5)
    const d = new Date(lunes);
    d.setDate(lunes.getDate() + i);
    const dStr = d.toISOString().slice(0, 10);
    if (esFestivoColombia(dStr)) return true;
  }
  return false;
}

function esHoraNocturna(horaAbsoluta) {
  const h = ((horaAbsoluta % 24) + 24) % 24;
  return h >= 19 || h < 6;
}

function nombreTipoHora(esOrdinaria, esNocturna, esDominicalFestivo) {
  if (esDominicalFestivo) {
    if (esOrdinaria) return esNocturna ? "Dominical/Festivo Ordinaria Nocturna" : "Dominical/Festivo Ordinaria Diurna";
    return esNocturna ? "Dominical/Festivo Extra Nocturna" : "Dominical/Festivo Extra Diurna";
  }
  if (esOrdinaria) return esNocturna ? "Recargo Nocturno (Ordinaria)" : "Ordinaria Diurna";
  return esNocturna ? "Extra Nocturna" : "Extra Diurna";
}

function calcularSegmentosHora(fechaStr, horaInicioStr, horaFinStr) {
  if (!fechaStr || !horaInicioStr || !horaFinStr) return null;
  const fecha = new Date(fechaStr + "T00:00:00");
  const diaSemana = fecha.getDay(); // 0=domingo,1=lunes,...,6=sábado

  const [hIni, mIni] = horaInicioStr.split(":").map(Number);
  const [hFin, mFin] = horaFinStr.split(":").map(Number);
  const inicio = hIni + (mIni || 0) / 60;
  let fin = hFin + (mFin || 0) / 60;
  if (fin <= inicio) fin += 24; // el turno cruza la medianoche (trabajo nocturno)
  if (fin - inicio > 24) return null; // dato improbable / error de digitación

  const esDominicalFestivo = (diaSemana === 0) || esFestivoColombia(fechaStr);
  const sig = sumarDias(fechaStr, 1);
  const esDominicalSig = new Date(sig + "T00:00:00").getDay() === 0 || esFestivoColombia(sig);

  // Cuota de horas ORDINARIAS del día (a partir de la hora en que inició el turno):
  //   Lunes a Jueves: 8h ordinarias (ej. 7am-3pm), luego extra
  //   Viernes:        7.5h ordinarias (ej. 7am-2:30pm), luego extra
  //   Sábado:         5h ordinarias (ej. 7am-12m), luego extra —
  //                   PERO si esa semana (lunes a sábado) tiene un festivo,
  //                   el sábado completo cuenta como extra (0h ordinarias).
  //   Domingo:        0h ordinarias — todo lo trabajado es extra.
  // MILÁN CAMPESTRE (Notas generales): L–J 7:00–4:00 p. m. = 8,5 h; V 7:00–3:30 p. m. = 8 h;
  // sábado 8:00 a. m.–2:00 p. m. = todo extra; domingo todo extra. Almuerzo de media hora (no se paga).
  let cuotaOrdinaria;
  if (diaSemana >= 1 && diaSemana <= 4) cuotaOrdinaria = DP_JORNADA.lj;      // lunes a jueves
  else if (diaSemana === 5) cuotaOrdinaria = DP_JORNADA.v;                    // viernes
  else if (diaSemana === 6) cuotaOrdinaria = DP_JORNADA.s;                    // sábado
  else cuotaOrdinaria = 0;                                                    // domingo: todo extra
  const almuerzo = (diaSemana >= 1 && diaSemana <= 6) ? [DP_JORNADA.almIni, DP_JORNADA.almFin] : null;
  const enAlmuerzo = t => !!almuerzo && t >= almuerzo[0] - 1e-9 && t <= almuerzo[1] + 1e-9;

  // Puntos de quiebre: inicio/fin del turno, fin de la cuota ordinaria, y
  // cada transición 19:00/06:00 (nocturno) que caiga dentro del turno.
  const puntos = new Set([inicio, fin]);
  if (almuerzo) almuerzo.forEach(p => { if (p > inicio && p < fin) puntos.add(p); });
  if (24 > inicio && 24 < fin) puntos.add(24);
  for (let k = -1; k * 24 <= fin + 24; k++) {
    const t19 = k * 24 + 19, t6 = k * 24 + 6;
    if (t19 > inicio && t19 < fin) puntos.add(t19);
    if (t6 > inicio && t6 < fin) puntos.add(t6);
  }
  const cortes = [...puntos].filter(p => p >= inicio - 1e-9 && p <= fin + 1e-9).sort((a, b) => a - b);

  const totales = {};
  let acum = 0; // horas trabajadas (sin almuerzo) para saber cuándo se acaba la cuota ordinaria
  for (let i = 0; i < cortes.length - 1; i++) {
    const ini = cortes[i], finTramo = cortes[i + 1];
    const dur = finTramo - ini;
    if (dur <= 1e-9) continue;
    const medio = (ini + finTramo) / 2;
    if (enAlmuerzo(medio)) continue; // media hora de almuerzo: no cuenta
    const esNocturna = esHoraNocturna(medio);
    const dom = medio >= 24 ? esDominicalSig : esDominicalFestivo;
    const ord = Math.max(0, Math.min(dur, cuotaOrdinaria - acum));
    if (ord > 1e-9) { const t = nombreTipoHora(true, esNocturna, dom); totales[t] = (totales[t] || 0) + ord; }
    if (dur - ord > 1e-9) { const t = nombreTipoHora(false, esNocturna, dom); totales[t] = (totales[t] || 0) + (dur - ord); }
    acum += dur;
  }
  return Object.entries(totales)
    .filter(([, h]) => h > 0.001)
    .map(([tipoHora, horas]) => ({ tipoHora, horas: Math.round(horas * 100) / 100 }));
}

function actualizarBotonGuardar() {
  if (modo === "buscador" || modo === "semana" || guardando) return;
  let listo;
  if (modo === "personal") {
    // v5: el botón de abajo avanza de paso; solo en el paso 4 envía
    const p = jornada.paso || 0, btn = document.getElementById("btnGuardar");
    document.getElementById("barraGuardar").style.display = maestroActual && p > 0 ? "" : "none";
    if (p > 0 && p < 4) {
      btn.textContent = ["", "Siguiente: actividades", "Siguiente: mi jornada", "Siguiente: revisar"][p];
      btn.disabled = !maestroActual;
      return;
    }
    listo = maestroActual && (jornada.lineas.length > 0 || (jornada.sup && jornada.sup.activo && !supYaGuardada()) || Object.keys(jornada.novedades || {}).length > 0);
    const n = listo ? construirFilasJornada().length : 0;
    btn.textContent = n ? `Enviar el día · ${n} registros` : "Enviar el día";
  } else if (modo === "equipos") {
    listo = maestroActual && bloques.some(b => b.codActividad && b.equipos.length > 0);
  } else {
    listo = maestroActual && bloques.some(b => b.codActividad && b.materiales.length > 0);
  }
  document.getElementById("btnGuardar").disabled = !listo;
}

async function guardarTodo() {
  if (modo === "personal") { return (jornada.paso || 0) < 4 ? siguientePaso() : guardarJornada(); }
  const fecha = document.getElementById("fecha").value;
  const filas = [];

  if (modo === "personal") {
    bloques.forEach(b => {
      if (!b.codActividad || !b.personas.length) return;
      const frente = CATALOGO.frentes.find(f => f.cod === b.codFrente);
      const actividad = CATALOGO.actividades.find(a => a.cod === b.codActividad);
      b.personas.forEach(p => {
        const base = {
          fecha: fecha,
          nombre: p.nombre,
          cargo: p.cargo,
          residente: maestroActual.residente,
          codfrente: b.codFrente,
          frenteNombre: frente ? frente.nombre : "",
          codcap: b.codCapitulo,
          codsubcap: b.codSubcap,
          codact: b.codActividad,
          actDesc: actividad ? actividad.desc : "",
          actUnidad: actividad ? actividad.unidad : "",
          cantidad: b.cantidadEjecutada || null,
          loteId: b.loteId,
          observaciones: p.cargo === "Sin confirmar" ? "Persona registrada manualmente, confirmar cargo y cédula" : "",
          creado: new Date().toISOString(),
          registradoPor: maestroActual.nombre,
        };
        // Si tiene "hora de finalización" (lunes a sábado), se parte en varias
        // filas automáticamente (Ordinaria/Extra/Nocturna según corresponda).
        // Si no (o es domingo), se guarda tal cual quedó en horas/tipoHora manual.
        const segmentos = calcularSegmentosHora(fecha, p.horaIni, p.horaFin);
        if (segmentos) {
          segmentos.forEach((seg, i) => {
            filas.push({
              id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}_${i}`,
              ...base,
              horas: seg.horas,
              tipoHora: seg.tipoHora,
            });
          });
        } else {
          filas.push({
            id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
            ...base,
            horas: parseFloat(p.horas) || 0,
            tipoHora: p.tipoHora,
          });
        }
      });
    });
  } else if (modo === "equipos") {
    bloques.forEach(b => {
      if (!b.codActividad || !b.equipos.length) return;
      const frente = CATALOGO.frentes.find(f => f.cod === b.codFrente);
      const actividad = CATALOGO.actividades.find(a => a.cod === b.codActividad);
      b.equipos.forEach(eq => {
        filas.push({
          id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
          fecha: fecha,
          solicitante: maestroActual.nombre,
          codfrente: b.codFrente,
          frenteNombre: frente ? frente.nombre : "",
          codcap: b.codCapitulo,
          codsubcap: b.codSubcap,
          codact: b.codActividad,
          actDesc: actividad ? actividad.desc : "",
          proveedor: eq.proveedor,
          equipo: eq.equipo,
          unidad: eq.unidad,
          cantidad: parseFloat(eq.cantidad) || 0,
          valorUnitario: eq.valorUnitario ? parseFloat(eq.valorUnitario) : null,
          observaciones: "",
          creado: new Date().toISOString(),
        });
      });
    });
  } else {
    bloques.forEach(b => {
      if (!b.codActividad || !b.materiales.length) return;
      const frente = CATALOGO.frentes.find(f => f.cod === b.codFrente);
      const actividad = CATALOGO.actividades.find(a => a.cod === b.codActividad);
      b.materiales.forEach(m => {
        filas.push({
          id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
          fecha: fecha,
          solicitante: maestroActual.nombre,
          codfrente: b.codFrente,
          frenteNombre: frente ? frente.nombre : "",
          codcap: b.codCapitulo,
          codsubcap: b.codSubcap,
          codact: b.codActividad,
          actDesc: actividad ? actividad.desc : "",
          material: m.material,
          cantidad: parseFloat(m.cantidad) || 0,
          unidad: m.unidad,
          creado: new Date().toISOString(),
        });
      });
    });
  }

  if (!filas.length) { mostrarToast("No hay nada para guardar todavía"); return; }

  document.getElementById("btnGuardar").disabled = true;
  document.getElementById("btnGuardar").textContent = "Guardando…";

  try {
    await fetch(URL_APPS_SCRIPT, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ registros: filas, hoja: modo === "equipos" ? "Equipos" : (modo === "materiales" ? "Materiales" : "Registros") }),
    });
    mostrarToast(`✔ Guardado: ${filas.length} registro(s) del día`);
    bloques = [];
    contadorBloque = 0;
    agregarBloque();
  } catch (e) {
    mostrarToast("No se pudo guardar. Revisa tu conexión e intenta de nuevo.");
  }
  document.getElementById("btnGuardar").textContent = "Guardar el día";
  actualizarBotonGuardar();
}

function mostrarToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => { t.style.display = "none"; }, 3500);
}

function lsGet(k, def) { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

function iniciarJornada() {
  jornada = { frenteDia: "", cuadrilla: [], lineas: [], cantidades: {}, novedades: {}, novEditando: null, just: {}, cierre: null,
    sup: { activo: lsGet(claveLS("supActivo"), true), ini: "07:00", fin: "", nocturno: false, motivo: "", auto: true,
           frentes: [], frentesAuto: true } };
  contLinea = 0;
  const propios = frentesDelMaestro();
  const guardados = lsGet(claveLS("frentes"), null);
  jornada.frentesDia = Array.isArray(guardados) && guardados.length ? guardados
    : [lsGet(claveLS("frente"), "") || (propios[0] ? propios[0].cod : "")].filter(Boolean);
  jornada.frenteDia = jornada.frentesDia[0] || "";
  // v5: arranca en el inicio y con la cuadrilla de la última vez ya cargada (se desmarca a quien no vino)
  jornada.paso = 0;
  const yo = maestroActual ? maestroActual.nombre : "";
  jornada.cuadrilla = lsGet(claveLS("cuadrilla"), []).filter(p => p && p.nombre && !(p.nombre === yo && jornada.sup.activo));
  // Da Porto: la primera vez, la cuadrilla sale de la pestaña Personal (columna "maestro") que llena Costos
  if (!jornada.cuadrilla.length && maestroActual) {
    const k = x => normTxt(x || "").replace(/\s+/g, " ").trim();
    jornada.cuadrilla = CATALOGO.personal.filter(p => p.maestro && k(p.maestro) === k(yo) && p.nombre !== yo).map(p => ({ nombre: p.nombre, cargo: p.cargo }));
  }
  renderJornada();
}

// v5: la jornada se muestra en un inicio (qué falta) y 4 pasos: 1 cuadrilla, 2 actividades, 3 mi jornada, 4 revisar y enviar
function renderJornada() {
  const z = document.getElementById("zonaJornada");
  const card = document.getElementById("cardQuien");
  if (modo === "semana") { renderSemana(); return; }
  if (!maestroActual) {
    card.style.display = "";
    z.innerHTML = `<div class="vacio">Selecciona tu nombre para empezar</div>`; actualizarBotonGuardar(); return;
  }
  const p = jornada.paso || 0;
  card.style.display = p === 0 ? "" : "none";
  if (p === 0) z.innerHTML = renderInicio();
  else z.innerHTML = encabezadoPaso(p) + [renderPaso1, renderPaso2, renderSupervision, renderPaso4][p - 1]();
  actualizarBotonGuardar();
}

function encabezadoPaso(p) {
  const titulos = ["", "¿Quién trabajó?", "¿Qué hicieron?", "Tu jornada", "Revisa y envía"];
  return `<div class="paso-top">
      <button aria-label="Volver" onclick="irPaso(${p - 1})">‹</button>
      <div><b>${titulos[p]}</b><span>${esc(fechaLarga(fechaActual()))} · paso ${p} de 4</span></div>
    </div>
    <div class="barra-pasos">${[1, 2, 3, 4].map(i => `<i class="${i <= p ? "on" : ""}"></i>`).join("")}</div>`;
}
function fechaLarga(d) {
  if (!d) return "";
  const dias = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
  const meses = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  const x = new Date(d + "T12:00:00");
  return `${dias[x.getDay()]} ${x.getDate()} ${meses[x.getMonth()]}`;
}
function irPaso(p) {
  jornada.paso = Math.max(0, Math.min(4, p));
  lineaEnPicker = null;
  renderJornada();
  window.scrollTo({ top: 0 });
}
function siguientePaso() {
  const p = jornada.paso || 0;
  if (p === 1) {
    if (!jornada.cuadrilla.length && !(jornada.sup && jornada.sup.activo)) { mostrarToast("Agrega al menos una persona o marca tu supervisión"); return; }
    const trabajan = jornada.cuadrilla.filter(x => !sinTrabajo(x.nombre));
    return irPaso(trabajan.length ? 2 : 3);
  }
  if (p === 2) {
    const prob = [];
    jornada.lineas.forEach((l, i) => {
      if (!l.horaIni || !l.horaFin) prob.push(`Actividad ${i + 1}: falta la hora de inicio o de fin`);
      if (!(l.codAct || l.np)) prob.push(`Actividad ${i + 1}: falta elegir la actividad`);
      if (!l.personas.length) prob.push(`Actividad ${i + 1}: no tiene personas`);
      if (finAntesDeInicio(l.horaIni, l.horaFin) && !l.nocturno) prob.push(`Actividad ${i + 1}: la hora de fin es antes que la de inicio`);
    });
    if (prob.length) { mostrarToast(prob[0]); return; }
    return irPaso(3);
  }
  if (p === 3) {
    const prob = problemasSupervision();
    if (prob.length) { mostrarToast(prob[0]); return; }
    return irPaso(4);
  }
}

// ---------- Paso 1: frentes y cuadrilla (quién trabajó y novedades) ----------
function renderPaso1() {
  const presentes = jornada.cuadrilla.filter(p => !sinTrabajo(p.nombre)).length;
  const previa = lsGet(claveLS("cuadrilla"), []);
  return `
    ${jornada.desdeAnterior ? `<div class="card card-pend ok">Copiado del ${esc(fechaLarga(jornada.desdeAnterior))}. Desmarca a quien no vino y revisa.
      <button class="btn btn-primario" style="margin-top:10px" onclick="irPaso(4)">Todo igual: revisar y enviar</button></div>` : ""}
    <div class="card">
      <h2>Frentes de hoy <span class="contador">${jornada.frentesDia.length}</span></h2>
      <div class="chips">${chipsFrentes(jornada.frentesDia, "toggleFrenteDia")}</div>
      <select class="agregar-frente" onchange="if(this.value){toggleFrenteDia(this.value)}">
        <option value="">+ Agregar otro frente</option>
        ${CATALOGO.frentes.filter(f => !opcionesFrentes(jornada.frentesDia).includes(f.cod)).map(f => `<option value="${f.cod}">${esc(f.nombre)}</option>`).join("")}
      </select>
    </div>
    <div class="card">
      <h2>Tu cuadrilla <span class="contador">${presentes} de ${jornada.cuadrilla.length}</span></h2>
      ${jornada.cuadrilla.map(filaCuadrilla).join("") || `<div class="vacio">Nadie todavía</div>`}
      ${previa.length && !jornada.cuadrilla.length ? `<button class="btn btn-suave" onclick="usarCuadrillaPrevia()">Usar la cuadrilla de la última vez (${previa.length})</button>` : ""}
      <div class="buscador-personal">
        <input type="text" id="buscaCuadrilla" placeholder="+ Agregar persona (escribe 2 letras)"
               oninput="buscarParaCuadrilla(this.value)" autocomplete="off">
        <div class="resultados" id="resCuadrilla" style="display:none"></div>
      </div>
      <button class="campo-libre" onclick="agregarLibreCuadrilla()">¿No aparece? Agregar nombre manualmente</button>
      <p class="nota">Desmarca a quien no trabajó y escoge el motivo. Si estuvo en examen, curso o permiso parte del día, toca <b>Novedad</b>.</p>
    </div>`;
}
function filaCuadrilla(p) {
  const nov = jornada.novedades[p.nombre];
  const trabaja = !sinTrabajo(p.nombre);
  return `<div class="fila-p ${trabaja ? "" : "con-nov"}">
      <label><input type="checkbox" ${trabaja ? "checked" : ""} onchange='togglePresente(${JSON.stringify(p.nombre)}, this.checked)'>
        <span><b>${esc(nombreCorto(p.nombre))}</b><small>${nov ? `<span class="tag-nov">${esc(textoNov(nov))}</span>` : esc(p.cargo || "")}${badgeYa(p.nombre)}</small></span></label>
      <button class="btn-nov" onclick='editarNovedad(${JSON.stringify(p.nombre)})'>Novedad</button>
      <button class="btn-x" aria-label="Quitar de la cuadrilla" onclick='quitarDeCuadrilla(${JSON.stringify(p.nombre)})'>✕</button>
    </div>
    ${jornada.novEditando === p.nombre ? renderNovedadEditor() : ""}`;
}
function togglePresente(nombre, on) {
  if (on) { const x = jornada.novedades[nombre]; if (x && x.dia) delete jornada.novedades[nombre]; jornada.novEditando = null; }
  else {
    jornada.novedades[nombre] = { tipo: "NOVINO", dia: true, ini: "07:00", fin: finCuota(), desc: "", sub: "", soporte: false };
    jornada.lineas.forEach(l => { l.personas = l.personas.filter(x => x !== nombre); });
    jornada.novEditando = nombre;
  }
  renderJornada();
}

// ---------- Paso 2: actividades ----------
function renderPaso2() {
  return `<div class="card">
      ${avisoHorarioFuturo()}
      <div id="lineas">${jornada.lineas.map(renderLinea).join("") || `<div class="vacio">Agrega la primera actividad</div>`}</div>
      ${renderSinActividad()}
      <button class="btn btn-agregar-bloque" onclick="agregarLinea()">
        + ${jornada.lineas.length ? "Otra actividad" : "Agregar actividad"}${ultimaHoraFin() ? " desde " + horaBonita(ultimaHoraFin()) : ""}
      </button>
    </div>`;
}
function renderSinActividad() {
  if (!jornada.lineas.length) return "";
  const usados = new Set(jornada.lineas.flatMap(l => l.personas));
  const sin = jornada.cuadrilla.filter(p => !sinTrabajo(p.nombre) && !usados.has(p.nombre));
  return sin.length ? `<p class="nota" style="color:#7A5E00;font-weight:600">${sin.length} sin ninguna actividad: ${sin.map(p => esc(nombreCorto(p.nombre))).join(", ")}</p>` : "";
}

// ---------- Paso 4: revisar y enviar ----------
function renderPaso4() {
  const prob = problemasJornada();
  return `
    ${cierreBloqueaFecha() ? renderCierreSemanal() : ""}
    ${prob.length ? `<div class="problemas"><b>Antes de enviar, corrige:</b><ul>${prob.slice(0, 6).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    ${(() => { // aviso: quien está marcado como presente pero no quedó en ninguna actividad ni tiene novedad
      const usados = new Set(jornada.lineas.flatMap(l => l.personas));
      const sin = jornada.cuadrilla.filter(p => !sinTrabajo(p.nombre) && !usados.has(p.nombre) && !intervaloNov(jornada.novedades[p.nombre]));
      return sin.length ? `<div class="sup-aviso" style="margin-bottom:14px"><b>${sin.map(p => esc(nombreCorto(p.nombre))).join(", ")}</b> no ${sin.length > 1 ? "quedaron" : "quedó"} en ninguna actividad. Si no trabajó, márcale la novedad en el paso 1; si trabajó, agrégalo en el paso 2.
        <button class="btn btn-suave" onclick="irPaso(1)">Ir al paso 1</button></div>` : "";
    })()}
    ${renderRevisar()}
    ${renderCantidades()}
    <p class="nota" style="text-align:center">Si no hay señal, el envío queda guardado en el celular y sale solo cuando vuelva.</p>`;
}

function nombreCorto(n) { const p = n.split(" ").filter(Boolean); return p.length > 2 ? `${p[0]} ${p[p.length >= 4 ? 2 : 1]}` : n; }

// ---------- Cuadrilla ----------
function buscarParaCuadrilla(txt) {
  const cont = document.getElementById("resCuadrilla");
  if (!txt || txt.length < 2) { cont.style.display = "none"; return; }
  const t = normTxt(txt);
  const ya = new Set(jornada.cuadrilla.map(p => p.nombre));
  const enc = CATALOGO.personal.filter(p => normTxt(p.nombre).includes(t) && !ya.has(p.nombre)).slice(0, 8);
  if (!enc.length) { cont.style.display = "none"; return; }
  cont.innerHTML = enc.map(p => `<div onclick='agregarACuadrilla(${JSON.stringify(p.nombre)}, ${JSON.stringify(p.cargo)})'>${esc(p.nombre)} <span style="color:#999">(${esc(p.cargo)})</span></div>`).join("");
  cont.style.display = "block";
}
function agregarACuadrilla(nombre, cargo) {
  if (jornada.cuadrilla.some(p => p.nombre === nombre)) return;
  if (maestroActual && nombre === maestroActual.nombre && jornada.sup && jornada.sup.activo) {
    mostrarToast("Tu jornada se registra en el paso 5 (supervisión). Si hoy trabajaste con la cuadrilla, primero desmarca la supervisión.");
    return;
  }
  jornada.cuadrilla.push({ nombre, cargo });
  jornada.lineas.forEach(l => { if (l.todos) l.personas.push(nombre); });
  renderJornada();
  setTimeout(() => { const i = document.getElementById("buscaCuadrilla"); if (i) i.focus(); }, 0);
}
function agregarLibreCuadrilla() {
  const nombre = prompt("Escribe el nombre completo de la persona:");
  if (nombre && nombre.trim()) agregarACuadrilla(nombre.trim().toUpperCase(), "Sin confirmar");
}
function quitarDeCuadrilla(nombre) {
  jornada.cuadrilla = jornada.cuadrilla.filter(p => p.nombre !== nombre);
  jornada.lineas.forEach(l => { l.personas = l.personas.filter(n => n !== nombre); });
  renderJornada();
}
function usarCuadrillaPrevia() {
  const previa = lsGet(claveLS("cuadrilla"), []);
  previa.forEach(p => { if (!jornada.cuadrilla.some(x => x.nombre === p.nombre)) jornada.cuadrilla.push(p); });
  renderJornada();
}

// ---------- Líneas de actividad ----------
function ultimaHoraFin() {
  const conFin = jornada.lineas.filter(l => l.horaFin);
  return conFin.length ? conFin[conFin.length - 1].horaFin : "";
}
function agregarLinea() {
  contLinea++;
  const ini = ultimaHoraFin() || "07:00";
  jornada.lineas.push({
    id: contLinea, horaIni: ini, horaFin: "", codFrente: (jornada.lineas.length ? jornada.lineas[jornada.lineas.length - 1].codFrente : jornada.frenteDia),
    codAct: "", np: null, // np = { cat, desc } si es no presupuestada
    personas: jornada.cuadrilla.map(p => p.nombre).filter(n => !sinTrabajo(n)), todos: true,
    loteId: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
  });
  lineaEnPicker = contLinea;
  renderJornada();
}
function quitarLinea(id) { jornada.lineas = jornada.lineas.filter(l => l.id !== id); if (lineaEnPicker === id) lineaEnPicker = null; renderJornada(); }
function setLinea(id, campo, valor) {
  const l = jornada.lineas.find(x => x.id === id); l[campo] = valor;
  if (campo === "horaIni" || campo === "horaFin" || campo === "codFrente") renderJornada();
}
function togglePersonaLinea(id, nombre) {
  if (sinTrabajo(nombre)) { mostrarToast("Esta persona tiene una novedad hoy (no trabajó). Quítale la novedad si sí trabajó."); return; }
  const l = jornada.lineas.find(x => x.id === id);
  l.personas = l.personas.includes(nombre) ? l.personas.filter(n => n !== nombre) : [...l.personas, nombre];
  l.todos = l.personas.length === jornada.cuadrilla.length;
  renderJornada();
}
function catDeLinea(l) { return l.np ? l.np.cat : (CAT_SINCO[l.codAct] || null); }
function textoActividad(l) {
  if (l.np) return { titulo: l.np.desc || "(sin descripción)", sub: `No presupuestada · ${l.np.cat} ${CATEGORIAS[l.np.cat].nombre}`, np: true };
  const a = CATALOGO.actividades.find(x => x.cod === l.codAct);
  if (!a) return null;
  const c = CAT_SINCO[a.cod];
  return { titulo: a.desc.split("(")[0].trim().slice(0, 90), sub: `${a.cod}${c ? " · categoría " + c : ""}`, np: false };
}

function renderLinea(l) {
  const act = textoActividad(l);
  const horasTxt = duracionTxt(l.horaIni, l.horaFin);
  const frenteNom = (CATALOGO.frentes.find(f => f.cod === l.codFrente) || {}).nombre || "";
  const otroFrente = jornada.frentesDia.length > 1 || l.codFrente !== jornada.frenteDia;
  return `
  <div class="linea ${act ? "" : "incompleta"}">
    <div class="linea-top">
      <b style="flex:1;color:var(--verde-oscuro);font-size:13.5px">Actividad ${jornada.lineas.indexOf(l) + 1}</b>
      <span class="dur ${finAntesDeInicio(l.horaIni, l.horaFin) && !l.nocturno ? "mal" : ""}">${l.horaIni && l.horaFin ? `${horaBonita(l.horaIni)} a ${horaBonita(l.horaFin)} · ${horasTxt}` : ""}</span>
      <button class="btn-x" onclick="quitarLinea(${l.id})" aria-label="Quitar actividad">✕</button>
    </div>
    <label>Desde</label>
    ${chipsHora(l.horaIni, [...(jornada.lineas.indexOf(l) > 0 && jornada.lineas[jornada.lineas.indexOf(l) - 1].horaFin ? [jornada.lineas[jornada.lineas.indexOf(l) - 1].horaFin] : []), ...HORAS_INI],
      v => `setLinea(${l.id}, 'horaIni', ${v})`, "Hora de inicio")}
    <label>Hasta</label>
    ${chipsHora(l.horaFin, HORAS_FIN, v => `setLinea(${l.id}, 'horaFin', ${v})`, "Hora de fin")}
    ${finAntesDeInicio(l.horaIni, l.horaFin) ? `
      <div class="alerta-hora">${l.nocturno ? "Termina después de medianoche, al día siguiente." :
        `La hora de fin (<b>${l.horaFin}</b>) quedó antes que la de inicio. Si terminaron en la tarde, cámbiala a <b>${horaTarde(l.horaFin)}</b> (PM).`}
        <label><input type="checkbox" ${l.nocturno ? "checked" : ""} onchange="setLinea(${l.id}, 'nocturno', this.checked); renderJornada()"> 🌙 Terminó después de medianoche (al día siguiente)</label>
      </div>` : ""}
    ${act ? `
      <div class="act-elegida" onclick="abrirPicker(${l.id})">
        <div class="act-titulo">${esc(act.titulo)} ${act.np ? `<span class="tag-np">no presupuestada</span>` : ""}</div>
        <div class="act-sub">${esc(act.sub)}${otroFrente ? " · frente " + l.codFrente : ""} · <u>cambiar</u></div>
      </div>` : ""}
    ${lineaEnPicker === l.id || !act ? renderPicker(l) : ""}
    <div class="chips chips-linea">
      ${jornada.cuadrilla.filter(p => !sinTrabajo(p.nombre)).map(p => `<button class="chip ${l.personas.includes(p.nombre) ? "on" : "off"}" onclick='togglePersonaLinea(${l.id}, ${JSON.stringify(p.nombre)})'>${esc(nombreCorto(p.nombre))}</button>`).join("")}
    </div>
  </div>`;
}

function abrirPicker(id) { lineaEnPicker = id; renderJornada(); }

// v3d: una actividad aparece en un frente si su código empieza por el frente o si es una adicional asignada a él ("*" = todos)
function actEnFrente(a, codFrente) {
  return !!a && (a.cod.startsWith(codFrente + ".") || (Array.isArray(a.frentes) && (a.frentes.includes("*") || a.frentes.includes(codFrente))));
}
function recientes(codFrente) {
  return lsGet(claveLS("recientes"), []).filter(c => actEnFrente(CATALOGO.actividades.find(x => x.cod === c), codFrente)).slice(0, 6);
}
function renderPicker(l) {
  const rec = recientes(l.codFrente);
  return `
  <div class="picker">
    <div class="fila">
      <div><label>Frente</label>
        <select onchange="setLinea(${l.id}, 'codFrente', this.value)">${frenteOpciones({ codFrente: l.codFrente })}</select></div>
    </div>
    ${rec.length ? `<label>Recientes</label><div class="chips">${rec.map(c => {
      const a = CATALOGO.actividades.find(x => x.cod === c);
      return a ? `<button class="chip rec" onclick="elegirActividad(${l.id}, '${c}')">${esc(a.desc.split("(")[0].trim().slice(0, 42))}</button>` : "";
    }).join("")}</div>` : ""}
    <label>Buscar actividad del presupuesto</label>
    <input type="text" placeholder="Ej. demolicion muro, pintura, escombros" oninput="buscarActividad(${l.id}, this.value)" autocomplete="off">
    <div class="lista-act" id="resAct-${l.id}"></div>
    ${renderSugerenciasNP(l)}
    <details class="np" ${l.np || l.npPend ? "open" : ""}>
      <summary>No está en el presupuesto</summary>
      <label>Categoría</label>
      <select id="npCat-${l.id}">
        <option value="">— Elige la categoría —</option>
        <optgroup label="Medibles">${Object.entries(CATEGORIAS).filter(([, c]) => c.medible).map(([k, c]) => `<option value="${k}" ${(l.np || l.npPend) && (l.np || l.npPend).cat === k ? "selected" : ""}>${k} · ${c.nombre}</option>`).join("")}</optgroup>
        <optgroup label="No medibles">${Object.entries(CATEGORIAS).filter(([, c]) => !c.medible).map(([k, c]) => `<option value="${k}" ${(l.np || l.npPend) && (l.np || l.npPend).cat === k ? "selected" : ""}>${k} · ${c.nombre}</option>`).join("")}</optgroup>
      </select>
      <label>Descripción corta</label>
      <input type="text" id="npDesc-${l.id}" maxlength="120" placeholder="Ej. Resane de muros zona bandas" value="${(l.np || l.npPend) ? esc((l.np || l.npPend).desc) : ""}">
      <button class="btn btn-suave" onclick="elegirNoPresupuestada(${l.id})">Usar esta actividad</button>
    </details>
  </div>`;
}
function buscarActividad(id, txt) {
  const l = jornada.lineas.find(x => x.id === id);
  const cont = document.getElementById(`resAct-${id}`);
  const palabras = normTxt(txt).split(/\s+/).filter(w => w.length >= 3);
  if (!palabras.length) { cont.innerHTML = ""; return; }
  // v5: entiende palabras de obra (SINONIMOS) y pone primero lo que la cuadrilla usa
  const coincide = a => coincideBusqueda(a, palabras);
  const enc = ordenarResultados(CATALOGO.actividades.filter(a => actEnFrente(a, l.codFrente) && coincide(a)), palabras).slice(0, 12);
  const otros = enc.length >= 8 ? [] : ordenarResultados(CATALOGO.actividades.filter(a => !actEnFrente(a, l.codFrente) && coincide(a)), palabras).slice(0, 8);
  cont.innerHTML = (enc.length ? enc.map(a => `
    <div onclick="elegirActividad(${id}, '${a.cod}')">
      <b>${esc(a.desc.split("(")[0].trim().slice(0, 80))}</b>
      <span>${a.cod} · ${a.unidad}${CAT_SINCO[a.cod] ? " · categoría " + CAT_SINCO[a.cod] : ""}${a.frentes ? " · adicional" : ""}</span>
    </div>`).join("") : `<p class="nota">Sin resultados en el frente ${l.codFrente}.</p>`)
    + (otros.length ? `<p class="nota">${enc.length ? "" : `<b>En el frente ${esc(nombreFrenteCorto(l.codFrente))} no está presupuestada.</b> `}En otros frentes (si la eliges, la actividad queda en ese frente):</p>` + otros.map(a => `

function aHoras(str) { if (!str) return null; const [h, m] = str.split(":").map(Number); return h + (m || 0) / 60; }

  const d = new Date(fechaStr + "T00:00:00").getDay();
  if (d >= 1 && d <= 4) return DP_JORNADA.lj;
  if (d === 5) return DP_JORNADA.v;

}
// Da Porto: media hora de almuerzo de lunes a sábado (12:00–12:30) que no se cuenta como trabajada
function almuerzoDia(fechaStr) {
  const d = new Date(fechaStr + "T00:00:00").getDay();

}
// intervalos: [{ini, fin, ref}] -> [{ref, tipoHora, horas}]
function clasificarDia(fechaStr, intervalos, ordYaUsadas) {
  const domDe = f => new Date(f + "T00:00:00").getDay() === 0 || esFestivoColombia(f);
  const dom = domDe(fechaStr), domSig = domDe(sumarDias(fechaStr, 1));
  let restante = Math.max(0, cuotaOrdinariaDia(fechaStr) - (ordYaUsadas || 0));
  const salida = [];

    const a = aHoras(iv.ini); let b = aHoras(iv.fin); if (b <= a) b += 24;
    return { ...iv, a, b };
  }).sort((x, y) => x.a - y.a);
  const alm = almuerzoDia(fechaStr);
  orden.forEach(iv => {
    const puntos = new Set([iv.a, iv.b]);
    if (alm) alm.forEach(t => { if (t > iv.a && t < iv.b) puntos.add(t); });
    for (let k = -1; k <= 2; k++) { [k * 24 + 19, k * 24 + 6].forEach(t => { if (t > iv.a && t < iv.b) puntos.add(t); }); }
    if (24 > iv.a && 24 < iv.b) puntos.add(24); // medianoche: lo que sigue es del día siguiente (dominical/festivo)
    const cortes = [...puntos].sort((x, y) => x - y);
    const tot = {};
    for (let i = 0; i < cortes.length - 1; i++) {
      const dur = cortes[i + 1] - cortes[i]; if (dur <= 1e-9) continue;

  });

}

}

// ---------- v3: jornada del maestro como SUPERVISIÓN ----------

function fechaLocal(desfaseDias) {
  const d = new Date(); d.setDate(d.getDate() + desfaseDias);
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}
function ponerFecha(desfase) { document.getElementById("fecha").value = fechaLocal(desfase); alCambiarFecha(); }
function alCambiarFecha() {
  actualizarFechaTxt();

  if (modo === "personal") renderJornada(); else if (modo === "semana") renderSemana(); else if (modo !== "buscador") renderBloques();
}
function actualizarFechaTxt() {
  const v = document.getElementById("fecha").value;
  const el = document.getElementById("fechaTxt"); if (!el) return;

  if (!v) { el.textContent = ""; return; }

  document.getElementById("btnAyer").classList.toggle("activo", v === fechaLocal(-1));

function avisoHorarioFuturo() {
  if (document.getElementById("fecha").value !== fechaLocal(0)) return "";
  const ahora = new Date(); const hhmm = String(ahora.getHours()).padStart(2, "0") + ":" + String(ahora.getMinutes()).padStart(2, "0");
  const futura = jornada.lineas.find(l => l.horaFin && l.horaFin > hhmm && (!l.horaIni || l.horaFin > l.horaIni));

function claveFila(f) { return [f.fecha, f.nombre, f.codact, f.tipoHora, f.horas, String(f.observaciones || "").slice(0, 11)].join("|"); }
function claveMed(m) { return ["M", m.fecha, m.frenteCod, m.categoriaLetra, m.cantidad].join("|"); }

// ---------- Validación y guardado ----------
function problemasJornada() {
  const p = [];
  if (cierreBloqueaFecha()) p.push("Primero envía el cierre de cantidades de la semana pasada (tarjeta roja de arriba)");
  if (!jornada.lineas.length && !(jornada.sup && jornada.sup.activo && !supYaGuardada()) && !Object.keys(jornada.novedades || {}).length) p.push("No hay actividades");
  jornada.lineas.forEach((l, i) => {
    if (!l.horaIni || !l.horaFin) p.push(`Actividad ${i + 1}: falta la hora de inicio o de fin`);
    if (!(l.codAct || l.np)) p.push(`Actividad ${i + 1}: falta elegir la actividad`);
    if (!l.personas.length) p.push(`Actividad ${i + 1}: no tiene personas`);
    if (finAntesDeInicio(l.horaIni, l.horaFin) && !l.nocturno) p.push(`Actividad ${i + 1}: la hora de fin (${l.horaFin}) es antes que la de inicio. Si terminaron en la tarde, escribe ${horaTarde(l.horaFin)}`);
    if (duracionH(l.horaIni, l.horaFin) > HORAS_TOPE) p.push(`Actividad ${i + 1}: da más de ${HORAS_TOPE} horas, revisa la hora de inicio y de fin`);
  });
  problemasSupervision().forEach(x => p.push(x));
  problemasNovedades().forEach(x => p.push(x));
  problemasCruce().forEach(x => p.push(x));
  excedidos().forEach(e => { if ((jornada.just[e.n] || "").trim().length < 4) p.push(`${nombreCorto(e.n)} pasa de ${HORAS_DIA_ALERTA} h en el día: escribe el motivo en el resumen del día`); });
  const mapa = porPersona();
  Object.entries(mapa).forEach(([n, ivs]) => { if (traslapes(ivs)) p.push(`${nombreCorto(n)} tiene horarios cruzados`); });
  return p;
}
function construirFilasJornada() {
  const fecha = document.getElementById("fecha").value;
  const filas = []; const mapa = porPersona();
  const creado = new Date().toISOString();
  Object.entries(mapa).forEach(([nombre, ivs]) => {
    const persona = jornada.cuadrilla.find(p => p.nombre === nombre) || { cargo: "Sin confirmar" };
    clasificarDia(fecha, ivs, ordYa(nombre, fecha)).forEach((seg, i) => {
      if (seg.ref === "NOV") {
        // v5: novedad pagada -> código de gastos generales del frente (el tablero la manda a la A, no al APU)
        const x = jornada.novedades[nombre]; const codF = jornada.frenteDia;
        const fr = CATALOGO.frentes.find(f => f.cod === codF);
        const iv = intervaloNov(x);
        filas.push({
          id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}_v${i}`,
