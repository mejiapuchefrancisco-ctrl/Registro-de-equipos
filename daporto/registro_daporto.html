          horas: seg.horas, tipoHora: seg.tipoHora, cantidad: null,
          observaciones: `NOVEDAD PAGADA: ${textoNov(x)} · ${iv.ini}-${iv.fin} · ${TIPOS_NOV[x.tipo].a}${TIPOS_NOV[x.tipo].soporte ? ` · soporte ${x.soporte ? "entregado" : "pendiente"}` : ""}${obsJust(nombre)}`,
          creado, registradoPor: maestroActual.nombre, loteId: `NOV_${x.tipo}_${creado}`,
        });
        return;
      }
      const l = jornada.lineas.find(x => x.id === seg.ref);
      const frente = CATALOGO.frentes.find(f => f.cod === l.codFrente);
      const a = l.np ? null : CATALOGO.actividades.find(x => x.cod === l.codAct);
      filas.push({
        id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}_${i}`,
        fecha, nombre, cargo: persona.cargo, residente: maestroActual.residente,
        codfrente: l.codFrente, frenteNombre: frente ? frente.nombre : "",
        codcap: a ? a.cod.split(".").slice(0, 2).join(".") : "", codsubcap: a ? a.codSubcap : "",
        codact: l.np ? `NP-${l.codFrente}-${l.np.cat}` : l.codAct,
        actDesc: l.np ? `[NO PRESUPUESTADA] ${l.np.desc}` : (a ? a.desc : ""),
        actUnidad: l.np ? CATEGORIAS[l.np.cat].unidad : (a ? a.unidad : ""),
        horas: seg.horas, tipoHora: seg.tipoHora, cantidad: null,
        observaciones: `${l.horaIni}-${l.horaFin}${persona.cargo === "Sin confirmar" ? " · Persona registrada manualmente, confirmar cargo y cédula" : ""}${obsJust(nombre)}`,
        creado, registradoPor: maestroActual.nombre, loteId: l.loteId,
      });
    });
  });
  filasSupervision(fecha, creado).forEach(f => filas.push(f));
  filasNovedades(fecha, creado).forEach(f => filas.push(f));
  return filas;
}
function construirMediciones() {
  const fecha = document.getElementById("fecha").value;
  return categoriasMediblesHoy().map(({ frente, cat }) => {
    const v = jornada.cantidades[`${frente}|${cat}`] || {};
    const cant = parseFloat(String(v.cantidad || "").replace(",", "."));
    if (!(cant > 0)) return null;
    const f = CATALOGO.frentes.find(x => x.cod === frente);
    const nps = jornada.lineas.filter(l => l.np && l.np.cat === cat && l.codFrente === frente).map(l => l.np.desc);
    return {
      fecha, oficial: v.oficial || `(registró ${maestroActual.nombre})`, frenteCod: frente, frenteNombre: f ? f.nombre : "",
      categoria: CATEGORIAS[cat].nombre, categoriaLetra: cat, unidad: CATEGORIAS[cat].unidad, cantidad: cant,
      observaciones: `Registrado por ${maestroActual.nombre}${nps.length ? " · incluye no presupuestada: " + nps.join("; ") : ""}`,
    };
  }).filter(Boolean);
}

async function guardarJornada() {
  const btn = document.getElementById("btnGuardar");
  const terminar = () => { guardando = false; btn.textContent = "Enviar el día"; actualizarBotonGuardar(); };
  let prob = problemasJornada();
  if (prob.length) { mostrarToast(prob[0]); return; }
  guardando = true; btn.disabled = true; btn.textContent = "Revisando el Sheet…";
  await cargarSheet(true);
  const conSheet = SHEET.estado === "ok" && Date.now() - SHEET.t < 60 * 1000;
  prob = problemasJornada(); // con las horas del Sheet ya actualizadas
  if (prob.length) { renderJornada(); mostrarToast(prob[0]); terminar(); return; }
  // Lo que ya se envió desde este celular (misma persona, fecha, actividad y horario) se omite solo
  const enviados = new Set(lsGet(claveLS("enviados"), []));
  const todasFilas = construirFilasJornada(), todasMeds = construirMediciones();
  const filas = todasFilas.filter(f => !enviados.has(claveFila(f)));
  const meds = todasMeds.filter(m => !enviados.has(claveMed(m)));
  const omitidas = (todasFilas.length - filas.length) + (todasMeds.length - meds.length);
  if (!filas.length && !meds.length) {
    mostrarToast("Esto ya estaba guardado desde este celular. No se repitió.");
    terminar(); iniciarJornada(); return;
  }
  if (!conSheet) {
    if (!confirm("Sin señal: no se pudo revisar si estas personas ya están registradas ese día.\n\nEl día queda guardado en el celular y se envía solo cuando vuelva la señal. ¿Continuar?")) { terminar(); return; }
  } else {
    const c = conflictos(filas);
    const duros = c.filter(x => x.duro), blandos = c.filter(x => !x.duro);
    if (duros.length) {
      alert("No se guardó. Estas personas ya tienen ese horario registrado ese día:\n\n• " + duros.map(x => x.txt).join("\n• ")
        + "\n\nQuítalas de la actividad o corrige la hora. Si el registro anterior está mal, avísale al residente.");
      renderJornada(); terminar(); return;
    }
    if (blandos.length && !confirm("Ojo:\n\n• " + blandos.map(x => x.txt).join("\n• ") + "\n\n¿Es trabajo adicional del mismo día? Si es así, guarda. Si es lo mismo, cancela.")) { terminar(); return; }
  }
  btn.textContent = "Enviando…";
  try {
    // v5: si no hay señal, queda en la cola del celular y se envía solo después
    const cuerpos = [];
    if (filas.length) cuerpos.push({ registros: filas, hoja: "Registros" });
    meds.forEach(m => cuerpos.push(m));
    const enLinea = await enviarOEncolar(cuerpos);
    lsSet(claveLS("cuadrilla"), jornada.cuadrilla);
    guardarUltima();
    const filasSup = filas.filter(f => String(f.actDesc || "").startsWith("[SUPERVISIÓN]"));
    if (filasSup.length) marcarSupGuardada(filasSup[0].fecha, { ini: jornada.sup.ini, fin: jornada.sup.fin,
      horas: Math.round(filasSup.reduce((a, f) => a + Number(f.horas || 0), 0) * 100) / 100 });
    lsSet(claveLS("enviados"), [...filas.map(claveFila), ...meds.map(claveMed), ...enviados].slice(0, 4000));
    sumarAlSheetLocal(filas);
    mostrarToast((enLinea ? `✔ Enviado: ${filas.length} registro(s)` : `Sin señal: ${filas.length} registro(s) guardados en el celular. Salen solos cuando vuelva la señal`)
      + (meds.length ? ` y ${meds.length} medición(es)` : "") + (omitidas ? ` · ${omitidas} ya estaban guardados y no se repitieron` : ""));
    guardando = false;
    iniciarJornada();
  } catch (e) {
    mostrarToast("No se pudo guardar. Revisa tu conexión e intenta de nuevo.");
  }
  terminar();
}

const SHEET_ID = "19DUOrw73kwzdnJGkTeVvsnuBv9oCjCrYPFtyD-JeS2c"; // Pulso de Obra - Da Porto - RAW
const HORAS_DIA_ALERTA = 10;

// ---------- Lectura del Sheet (Google Visualization, JSONP: funciona sin cambiar el Apps Script) ----------
function gviz(tq, hoja) {
  return new Promise((resolve, reject) => {
    const cb = `__gv${Date.now()}_${gvizN++}`;
    const s = document.createElement("script");
    const limpiar = () => { clearTimeout(t); try { delete window[cb]; } catch (e) { window[cb] = undefined; } s.remove(); };
    const t = setTimeout(() => { limpiar(); reject(new Error("tiempo agotado")); }, 20000);
    window[cb] = resp => {
      limpiar();
      if (!resp || resp.status === "error") reject(new Error((resp && resp.errors && resp.errors[0] && resp.errors[0].detailed_message) || "error del Sheet"));
      else resolve(resp.table || { rows: [] });

    s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}`
      + `&sheet=${encodeURIComponent(hoja)}&headers=1&tq=${encodeURIComponent(tq)}`;
    document.head.appendChild(s);

    if (m) return `${m[1]}-${String(+m[2] + 1).padStart(2, "0")}-${String(+m[3]).padStart(2, "0")}`;
    m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);

  }

}
function filasDeTabla(t, campos) {

      catch (e) { t = await gviz(`select B,C,M,N,P,R`, "Registros"); } // por si la columna de fecha no es de tipo fecha
      const filas = filasDeTabla(t, campos)
        .map(f => ({ fecha: String(f.fecha).slice(0, 10), nombre: String(f.nombre || ""), horas: aNum(f.horas),
                     tipoHora: String(f.tipoHora || ""), obs: String(f.obs || ""), por: String(f.por || "") }))
        .filter(f => f.nombre && /^\d{4}-\d{2}-\d{2}$/.test(f.fecha) && f.fecha >= desde);

function diasAPendiente() {

}

function cruceVivo(n) {

function semanaCierre() {

    SHEET.filas.some(f => f.n === yo && esCantidad(f) && f.fecha >= lun && f.fecha <= sab);

function coincideBusqueda(a, palabras) {

    const base = w.replace(/s$/, "");
    if (d.includes(w) || (base.length >= 3 && d.includes(base))) return true;
    return (SINONIMOS[w] || SINONIMOS[base] || []).some(s => d.includes(normTxt(s)));

function ordenarResultados(lista, palabras) {
  const rec = lsGet(claveLS("recientes"), []);

  const propios = new Set([...frentesDelMaestro().map(f => f.cod), ...(jornada.frentesDia || [])]);
  const puntos = a => {

      ${estado}
      ${resumenU ? `<button class="btn-grande" onclick="igualQueAntes()">Igual que el ${esc(fechaLarga(u.fecha))}<small>${resumenU}</small></button>` : ""}
      <button class="btn btn-secundario" onclick="irPaso(1)">Registrar ${fecha === hoy ? "hoy" : "este día"} paso a paso</button>
    </div>
    ${renderPendientes()}
    ${tiraSemana()}`;
}
function tiraSemana() {
  if (SHEET.estado !== "ok") return "";
  const crew = cuadrillaSinMi(); if (!crew.length) return "";
  const fecha = fechaActual(), lun = lunesDe(fecha), hoy = fechaLocal(0);
  const dias = [0, 1, 2, 3, 4, 5, 6].map(i => sumarDias(lun, i));
  return `<div class="card">
    <h2 style="display:flex;justify-content:space-between;align-items:center">Semana del ${diaCorto(lun)}
      <button class="campo-libre" onclick="cambiarModo('semana')">Ver mi semana ›</button></h2>
    <div class="tira">${dias.map(d => {
      const reg = crew.filter(p => regsDia(p.nombre, d).length).length;
      const fut = d > hoy;
      const cls = fut ? "" : reg === crew.length ? "completo" : reg ? "parcial" : "";
      return `<button class="${cls} ${d === fecha ? "sel" : ""}" ${fut ? "disabled" : ""} onclick="irAFecha('${d}')">
        <span>${["L", "M", "M", "J", "V", "S", "D"][(diaSemana(d) + 6) % 7]}</span><b>${fut ? "" : reg ? `${reg}/${crew.length}` : "–"}</b></button>`;
    }).join("")}</div>
  </div>`;
}

// ---------- Paso 4: cada persona con la línea de su día ----------
function tramosDia(n, ivs, fecha) {
  const dom = diaSemana(fecha) === 0 || esFestivoColombia(fecha);
  let rest = Math.max(0, cuotaOrdinariaDia(fecha) - ordYa(n, fecha));
  const out = [];
  ivs.map(iv => { const a = aHoras(iv.ini); let b = aHoras(iv.fin); if (b <= a) b += 24; return { a, b, nov: iv.ref === "NOV" }; })
    .sort((x, y) => x.a - y.a)
    .forEach(iv => {
      if (dom) { out.push({ a: iv.a, b: iv.b, t: iv.nov ? "nov" : "dom" }); return; }
      const o = Math.min(rest, iv.b - iv.a);
      if (o > 0) out.push({ a: iv.a, b: iv.a + o, t: iv.nov ? "nov" : "ord" });
      if (iv.b - iv.a - o > 1e-9) out.push({ a: iv.a + o, b: iv.b, t: "ext" });
      rest -= o;
    });
  regsDia(n, fecha).filter(f => f.horas > 0 && !f.local).forEach(f => {
    const r = rangoTxt(f.obs); if (!r) return;
    const a = aHoras(r.ini); let b = aHoras(r.fin); if (b <= a) b += 24;
    out.push({ a, b, t: "ya" });
  });
  return out;
}
function renderRevisar() {
  const fecha = fechaActual();
  const filas = Object.entries(porPersona()).map(([n, ivs]) => ({ n, ivs }));
  const s = jornada.sup;
  if (maestroActual && s && s.activo && !supYaGuardada() && s.ini && s.fin && !(finAntesDeInicio(s.ini, s.fin) && !s.nocturno))
    filas.push({ n: maestroActual.nombre, ivs: [{ ini: s.ini, fin: s.fin, ref: "SUP" }], sup: true });
  const sinTrab = Object.entries(jornada.novedades || {}).filter(([, x]) => x.dia && !TIPOS_NOV[x.tipo].paga);
  if (!filas.length && !sinTrab.length) return `<div class="card"><div class="vacio">Todavía no hay nada para enviar</div></div>`;
  const todos = filas.flatMap(f => tramosDia(f.n, f.ivs, fecha));
  const lo = Math.floor(Math.min(7, ...todos.map(t => t.a))), hi = Math.ceil(Math.max(17, ...todos.map(t => t.b)));
  const pos = h => (h - lo) / (hi - lo) * 100;
  let totH = 0, totE = 0;
  const html = filas.map(f => {
    if (traslapes(f.ivs)) return `<div class="rev-fila"><div class="cab"><b>${esc(nombreCorto(f.n))}</b><span style="color:#B4453A;font-weight:700">Horarios cruzados</span></div></div>`;
    const seg = clasificarDia(fecha, f.ivs, ordYa(f.n, fecha));
    const t = seg.reduce((a, x) => a + x.horas, 0), e = seg.filter(x => x.tipoHora.includes("Extra")).reduce((a, x) => a + x.horas, 0);
    const ya = horasYa(f.n, fecha);
    if (!f.sup) { totH += t; totE += e; }
    const cr = cruceVivo(f.n);
    const nov = jornada.novedades[f.n];
    return `<div class="rev-fila">
      <div class="cab"><b>${esc(nombreCorto(f.n))}${f.sup ? " (supervisión)" : ""}</b><span><b>${r2(t + ya)} h</b>${e > 0.001 ? ` <span class="extra">· ${r2(e)} extra</span>` : ""}</span></div>
      <div class="tl">${tramosDia(f.n, f.ivs, fecha).map(x => `<span class="${x.t}" style="left:${pos(x.a).toFixed(2)}%;width:${(pos(x.b) - pos(x.a)).toFixed(2)}%"></span>`).join("")}</div>
      ${cr ? `<small style="color:#B4453A;font-weight:600">${esc(cr)}</small>` : ""}
      ${nov ? `<small class="tag-nov" style="font-size:12px">${esc(textoNov(nov))}</small>` : ""}
    </div>`;
  }).join("");
  const personas = new Set(filas.filter(f => !f.sup).map(f => f.n)).size;
  const marcas = [...new Set([lo, 12, hi])].filter(v => v >= lo && v <= hi);
  return `<div class="card">
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px;text-align:center">
      <div><b style="font-size:21px;color:var(--verde-oscuro)">${personas}</b><br><small class="nota-h">personas</small></div>
      <div><b style="font-size:21px;color:var(--verde-oscuro)">${r2(totH)}</b><br><small class="nota-h">horas</small></div>
      <div><b style="font-size:21px;color:#7A5E00">${r2(totE)}</b><br><small class="nota-h">horas extra</small></div>
    </div>
    <div class="tl-escala">${marcas.map(m => `<span style="left:${Math.min(94, Math.max(6, pos(m))).toFixed(1)}%">${horaBonita(String(m % 24).padStart(2, "0") + ":00")}</span>`).join("")}</div>
    ${html}
    ${sinTrab.map(([n, x]) => `<div class="rev-fila"><div class="cab"><b style="color:#6B756F">${esc(nombreCorto(n))}</b><span class="tag-nov">${esc(textoNov(x))} · 0 h</span></div></div>`).join("")}
    <div class="leyenda"><span><i style="background:var(--verde)"></i>Ordinarias</span><span><i style="background:#E0A526"></i>Extra</span>
      <span><i style="background:#8A5A9E"></i>Novedad pagada</span><span><i style="background:#3D6E8C"></i>Dominical</span>
      <span><i style="background:#C9D3CC"></i>Ya registrado por otro</span></div>
    ${renderJustificaciones()}
  </div>`;
}

// ---------- Mi semana: horas de la cuadrilla, extra semanal y novedades para nómina ----------
let semanaSel = null;
function abrevNov(txt) {
  const t = txt.replace(/^NOVEDAD( PAGADA)?: /, "").split(" · ")[0];
  const m = { "No vino": "NV", "Incapacidad": "Inc", "Vacaciones": "Vac", "Suspensión": "Sus", "Permiso no remunerado": "PNR", "Permiso": "Per" };
  return m[t] || t.slice(0, 3);
}
function renderSemana() {
  const z = document.getElementById("zonaSemana");
  if (!maestroActual) { z.innerHTML = `<div class="vacio">Selecciona tu nombre para ver tu semana</div>`; return; }
  if (SHEET.estado !== "ok") {
    z.innerHTML = `<div class="card"><p class="nota">${SHEET.estado === "error"
      ? `Sin conexión con el Sheet. <button class="campo-libre" onclick="cargarSheet(true)">Reintentar</button>` : "Leyendo los registros de la semana…"}</p></div>`;
    if (SHEET.estado === "nada") cargarSheet();
    return;
  }
  const hoy = fechaLocal(0), actual = lunesDe(hoy), anterior = sumarDias(actual, -7);
  const lun = semanaSel === anterior ? anterior : actual;
  const dias = [0, 1, 2, 3, 4, 5, 6].map(i => sumarDias(lun, i));
  const yo = nn(maestroActual.nombre);
  const enSem = SHEET.filas.filter(f => f.fecha >= lun && f.fecha <= dias[6] && !esCantidad(f));
  const enCat = new Map(CATALOGO.personal.map(p => [nn(p.nombre), p.nombre]));
  const m = new Map(cuadrillaSinMi().map(p => [p.k, p.nombre]));
  enSem.filter(f => nn(f.por) === yo && f.n !== yo).forEach(f => { if (!m.has(f.n)) m.set(f.n, enCat.get(f.n) || f.nombre); });
  const personas = [...m.entries()].map(([k, nombre]) => {
    const regs = enSem.filter(f => f.n === k);
    const porDia = dias.map(d => {
      const r = regs.filter(f => f.fecha === d); const h = r.reduce((a, f) => a + f.horas, 0);
      const nov = r.find(f => f.obs.startsWith("NOVEDAD:"));
      return { d, h, nov: h > 0 ? "" : nov ? abrevNov(nov.obs) : "" };
    });
    const ext = regs.filter(f => /extra/i.test(f.tipoHora)).reduce((a, f) => a + f.horas, 0);
    return { k, nombre, porDia, tot: porDia.reduce((a, x) => a + x.h, 0), ext };
  }).sort((a, b) => b.ext - a.ext || a.nombre.localeCompare(b.nombre));
  const pasados = personas.filter(p => p.ext > 12 + 1e-9);
  // novedades de la semana (para la liquidación de nómina)
  const agrup = new Map();
  enSem.filter(f => f.obs.startsWith("NOVEDAD") && (m.has(f.n) || nn(f.por) === yo)).forEach(f => {
    const txt = f.obs.replace(/^NOVEDAD( PAGADA)?: /, "").split(" · ")[0];
    const k = `${f.fecha}|${f.n}|${txt}`;
    const x = agrup.get(k) || { fecha: f.fecha, nombre: m.get(f.n) || f.nombre, txt, horas: 0, paga: f.obs.startsWith("NOVEDAD PAGADA"),
      pend: f.obs.includes("soporte pendiente"), a: (f.obs.match(/· (Gastos generales|Administración)/) || [])[1] || "" };
    x.horas += f.horas; agrup.set(k, x);
  });
  const novs = [...agrup.values()].sort((a, b) => a.fecha.localeCompare(b.fecha));
  const hPag = novs.filter(x => x.paga).reduce((a, x) => a + x.horas, 0);
  const diasNo = novs.filter(x => !x.paga && /^(No vino|Suspensión|Permiso no remunerado)/.test(x.txt)).length;
  const pend = novs.filter(x => x.pend).length;
  z.innerHTML = `
    <div class="card" style="display:flex;align-items:center;gap:8px">
      <button class="btn-nov" ${lun === anterior ? "disabled" : ""} onclick="semanaSel='${anterior}'; renderSemana()">‹ Anterior</button>
      <b style="flex:1;text-align:center;color:var(--verde-oscuro)">${diaCorto(lun)} a ${diaCorto(dias[6])}</b>
      <button class="btn-nov" ${lun === actual ? "disabled" : ""} onclick="semanaSel=null; renderSemana()">Esta ›</button>
    </div>
    ${renderCierreSemanal()}
    <div class="card">
      <h2>Horas de tu cuadrilla</h2>
      ${personas.length ? `<div class="sem-grid">
        <span class="h" style="text-align:left">Persona</span>${["L", "M", "M", "J", "V", "S", "D"].map(x => `<span class="h">${x}</span>`).join("")}<span class="h">Tot</span><span class="h">Extra</span>
        ${personas.map(p => `<span class="n" title="${esc(p.nombre)}">${esc(nombreCorto(p.nombre))}</span>${p.porDia.map((x, i) =>
          `<span class="c ${x.h > 0 ? (x.h > HORAS_DIA_ALERTA ? "alto" : (i === 6 || esFestivoColombia(x.d)) ? "dom" : "t") : x.nov ? "nv" : ""}">${x.h > 0 ? r2(x.h) : esc(x.nov)}</span>`).join("")}
          <span class="tot">${r2(p.tot)}</span><span class="ex ${p.ext > 12 + 1e-9 ? "mal" : ""}">${r2(p.ext)}</span>`).join("")}
      </div>
      <div class="leyenda"><span><i style="background:#FFE3B0"></i>Más de ${HORAS_DIA_ALERTA} h</span><span><i style="background:#DCE6F2"></i>Dominical o festivo</span>
        <span><i style="background:#EFE7F3"></i>Novedad (NV no vino, Inc, Vac…)</span><span><i style="background:#B3261E"></i>Más de 12 h extra</span></div>`
      : `<p class="nota">Sin registros de tu cuadrilla en esta semana.</p>`}
    </div>
    ${pasados.length ? `<div class="problemas"><b>${pasados.map(p => esc(nombreCorto(p.nombre))).join(", ")} ${pasados.length > 1 ? "pasan" : "pasa"} de 12 h extra en la semana</b> (límite legal). Revisa con el residente antes de programar más horas extra.</div>` : ""}
    <div class="card">
      <h2>Novedades de la semana <span class="contador">${novs.length}</span></h2>
      ${novs.length ? `<p class="nota" style="margin:0 0 6px">${r2(hPag)} h pagadas sin actividad · ${diasNo} día(s) sin pago${pend ? ` · <b style="color:#7A5E00">${pend} soporte(s) pendiente(s)</b>` : ""}</p>
        ${novs.map(x => `<div class="nov-sem"><b>${diaCorto(x.fecha)} · ${esc(nombreCorto(x.nombre))}</b> · ${esc(x.txt)}<br>
          ${x.paga ? `<span class="pill paga">Paga ${r2(x.horas)} h</span>${x.a ? `<span class="pill gris">${esc(x.a)}</span>` : ""}`
            : /^(Incapacidad|Vacaciones)/.test(x.txt) ? `<span class="pill gris">EPS / nómina</span>` : `<span class="pill nopaga">No se paga</span>`}
          ${x.pend ? `<span class="pill pend">Falta el soporte</span>` : ""}</div>`).join("")}`
      : `<p class="nota">No se marcaron novedades esta semana.</p>`}
    </div>`;
}

cargarCatalogo();
</script>
